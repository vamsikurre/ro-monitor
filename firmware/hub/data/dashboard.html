<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>RO Plant · Live</title>
<style>
/* ─────────────────────────────────────────────────────────────
   RO-MONITOR — PLANT ELEVATION DASHBOARD
   Self-contained. No external requests — the hub is LAN-only.
   Palette validated against dataviz six-checks (dark, surface #18202C).

   Drawn as a true elevation, because the lift is the point: this plant
   fails by pumping dry from the lowest vessel to the highest.
     Roof of RO room ...... RWT, TWT
     Terrace .............. RO room (RWP, Dosing, HPP) + Battery Room
     Ground / parking ..... Sump, Sump Motor
     Below grade .......... Borewell
   ───────────────────────────────────────────────────────────── */
:root{
  --ground-c:#10161F; --panel:#18202C; --line:#2A3646; --line-2:#3E4E63;
  --ink:#E6ECF3; --ink-2:#9AA7B8; --ink-3:#6B7787;
  /* fluids — categorical, ΔE 17.8 normal / 17.3 deutan */
  --raw:#3E8F5F; --treated:#2B8FD4; --additive:#9A7B3C;
  /* status — reserved, never a fluid. ΔE 22.4 normal / 10.0 deutan */
  --warn:#B08F1A; --fault:#D93E68; --offline:#6B7787;
  --ui:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono","Cascadia Mono","Segoe UI Mono",Menlo,Consolas,"Liberation Mono",monospace;
  --r:3px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--ground-c); color:var(--ink); font-family:var(--ui);
  font-size:15px; line-height:1.45; padding:0 0 40px; font-variant-numeric:tabular-nums;
}
.legend{font-size:10px; font-weight:600; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-3); white-space:nowrap}
.readout{font-family:var(--mono); font-variant-numeric:tabular-nums; font-weight:600}

/* ── header ─────────────────────────────────────────────── */
header{
  display:flex; flex-wrap:wrap; align-items:baseline; gap:8px 22px;
  padding:16px 22px; border-bottom:1px solid var(--line); background:var(--panel);
  position:sticky; top:0; z-index:30;
}
h1{font-size:15px; font-weight:600; letter-spacing:.08em; text-transform:uppercase}
h1 span{color:var(--ink-3); font-weight:400}
.hstats{display:flex; flex-wrap:wrap; gap:6px 20px; margin-left:auto; align-items:baseline}
.hstat{display:flex; gap:7px; align-items:baseline}
.hstat .readout{font-size:13px; color:var(--ink)}
.mode{
  font-family:var(--mono); font-size:10px; letter-spacing:.1em; text-transform:uppercase;
  border:1px solid var(--line); border-radius:100px; padding:3px 10px; color:var(--ink-2);
  display:inline-flex; align-items:center; gap:7px;
}
.mode::before{content:""; width:6px; height:6px; border-radius:50%; background:var(--ink-3); animation:beat 2.6s ease-in-out infinite}
.mode.live::before{background:var(--treated)}
@keyframes beat{0%,100%{opacity:1}50%{opacity:.25}}

/* ── alerts ─────────────────────────────────────────────── */
#alerts:not(:empty){padding:12px 22px 0; display:flex; flex-direction:column; gap:7px}
.alert{display:flex; gap:12px; align-items:baseline; padding:9px 13px; border-radius:var(--r); border:1px solid; font-size:13px; background:var(--panel)}
.alert b{font-family:var(--mono); font-size:10px; letter-spacing:.12em; text-transform:uppercase; flex:none}
.alert.warn{border-color:color-mix(in srgb,var(--warn) 55%,transparent)}
.alert.warn b{color:var(--warn)}
.alert.fault{border-color:color-mix(in srgb,var(--fault) 55%,transparent)}
.alert.fault b{color:var(--fault)}
.alert .where{color:var(--ink-2); margin-left:auto; font-size:12px; flex:none}

/* ── the plant, in elevation (signature) ────────────────── */
.plantwrap{padding:22px 22px 6px; overflow-x:auto}
.plant{
  position:relative; display:grid; min-width:1080px;
  grid-template-columns:[lbl] 122px [c1] .92fr [c2] .58fr [c3] 1fr [c4] .95fr [c5] 1fr [c6] .95fr;
  grid-template-rows:auto minmax(248px,auto) auto 0 auto;
  row-gap:62px;
}
.plant > svg.pipes{position:absolute; inset:0; z-index:0; pointer-events:none; overflow:visible}
.cell{display:flex; justify-content:center; align-items:center; position:relative; z-index:2}
.cell.top{align-items:flex-start}
.cell.bottom{align-items:flex-end}

/* elevation band label — encodes real building height, not decoration */
.tier{grid-column:lbl; display:flex; flex-direction:column; gap:3px; justify-content:center; align-items:flex-start; position:relative; z-index:2}
.tier b{font-size:11px; font-weight:600; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-2)}
.tier span{font-size:10.5px; color:var(--ink-3)}

/* the RO room, with both roof tanks resting on it */
.room{grid-row:2; border:1px solid var(--line-2); border-radius:var(--r); margin:-18px -12px; position:relative; z-index:1}
.room > .tag{position:absolute; top:-8px; left:14px; background:var(--ground-c); padding:0 8px}

/* battery room — beside the RO room on the terrace, not in the water path */
.annex{grid-row:2; border:1px dashed var(--line-2); border-radius:var(--r); margin:-18px 0; position:relative; z-index:1; display:flex; align-items:center; justify-content:center}
.annex > .tag{position:absolute; top:-8px; left:13px; background:var(--ground-c); padding:0 8px}

/* grade line — what is underground and what is not */
.grade{grid-column:1 / -1; grid-row:4; position:relative; z-index:2; border-top:1px dashed color-mix(in srgb,var(--line-2) 90%,transparent)}
.grade > span{position:absolute; top:-7px; right:0; background:var(--ground-c); padding:0 9px}

.flowing{animation:dash 1.15s linear infinite}
@keyframes dash{to{stroke-dashoffset:-20}}
.flowing.thin{animation:dash-thin 1.6s linear infinite}
@keyframes dash-thin{to{stroke-dashoffset:-12}}

/* ── units ──────────────────────────────────────────────── */
.unit{display:flex; flex-direction:column; align-items:center; gap:8px}
.unit .name{font-size:11px; font-weight:600; letter-spacing:.1em; text-transform:uppercase; text-align:center;
  background:var(--ground-c); padding:1px 8px; border-radius:2px}
.unit .sub{font-size:11px; color:var(--ink-2); font-family:var(--mono); text-align:center;
  background:var(--ground-c); padding:1px 8px; border-radius:2px}
.vessel{position:relative}
.vessel .pct{
  position:absolute; left:0; right:0; top:15%; text-align:center;
  font-family:var(--mono); font-weight:700; font-size:22px; letter-spacing:-.02em;
  text-shadow:0 1px 6px rgba(0,0,0,.8); pointer-events:none;
}
.vessel .pct small{display:block; font-size:10px; font-weight:600; letter-spacing:.1em; opacity:.72; margin-top:1px}
.vessel .nodata{font-size:12px; letter-spacing:.1em; color:var(--ink-3)}
.chip{
  font-family:var(--mono); font-size:9.5px; letter-spacing:.11em; text-transform:uppercase;
  padding:2px 7px; border-radius:100px; border:1px solid var(--line); color:var(--ink-2);
  display:inline-block; white-space:nowrap; background:var(--ground-c);
}
.chip.on{color:var(--ink); border-color:color-mix(in srgb,var(--treated) 60%,transparent)}
.chip.warn{color:var(--warn); border-color:color-mix(in srgb,var(--warn) 55%,transparent)}
.chip.fault{color:var(--fault); border-color:color-mix(in srgb,var(--fault) 55%,transparent)}
.chip.off{color:var(--ink-3)}
.rotor{transform-origin:0 0}
.spin .rotor{animation:spin 2.6s linear infinite}
.fast .rotor{animation-duration:1.5s}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── instrument strip ───────────────────────────────────── */
.grid{display:grid; gap:14px; padding:20px 22px 0; grid-template-columns:repeat(auto-fit,minmax(268px,1fr))}
.card{background:var(--panel); border:1px solid var(--line); border-radius:var(--r); padding:14px 15px}
.card > .legend{display:block; margin-bottom:12px; padding-bottom:9px; border-bottom:1px solid var(--line)}
.climate{display:flex; align-items:flex-end; gap:20px; flex-wrap:wrap}
.big{font-family:var(--mono); font-weight:700; font-size:31px; letter-spacing:-.025em; line-height:1}
.big u{text-decoration:none; font-size:15px; color:var(--ink-2); font-weight:600; margin-left:2px}
.metric{display:flex; flex-direction:column; gap:5px}
.fanrow{display:flex; align-items:center; gap:13px; margin-top:14px; padding-top:13px; border-top:1px solid var(--line)}
.fanrow .txtblk{display:flex; flex-direction:column; gap:6px; align-items:flex-start}
.srcline{flex-basis:100%; display:flex; align-items:center; gap:11px; margin-top:14px; padding-top:12px; border-top:1px solid var(--line)}
.rows{display:flex; flex-direction:column}
.row{display:flex; align-items:center; gap:12px; padding:7px 0; border-bottom:1px solid color-mix(in srgb,var(--line) 55%,transparent)}
.row:last-child{border-bottom:0}
.row .k{font-size:12px; letter-spacing:.05em; color:var(--ink-2); font-family:var(--mono)}
.row .v{margin-left:auto; display:flex; align-items:center; gap:9px}
.row .n{font-family:var(--mono); font-size:12px; color:var(--ink-2)}
footer{padding:20px 22px 0; color:var(--ink-3); font-size:11.5px; display:flex; flex-wrap:wrap; gap:6px 20px}

/* Narrow screens keep the elevation and scroll sideways. Flattening it
   would throw away the one thing the drawing exists to show. */
@media (max-width:900px){
  header,.grid,#alerts:not(:empty),footer,.plantwrap{padding-left:16px; padding-right:16px}
  .hstats{margin-left:0; width:100%; gap:4px 15px}
  .hstat .readout{font-size:12px}
  header{gap:7px 15px; padding-top:13px; padding-bottom:13px}
}

:focus-visible{outline:2px solid var(--treated); outline-offset:2px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important; transition:none!important}}
</style>
</head>
<body>

<header>
  <h1>RO Plant <span>/ Elevation</span></h1>
  <span class="mode" id="mode">Demo data</span>
  <div class="hstats">
    <div class="hstat"><span class="legend">Bus</span><span class="readout" id="hBus">–</span></div>
    <div class="hstat"><span class="legend">Signal</span><span class="readout" id="hRssi">–</span></div>
    <div class="hstat"><span class="legend">Uptime</span><span class="readout" id="hUp">–</span></div>
    <div class="hstat"><span class="legend">Updated</span><span class="readout" id="hClock">–</span></div>
  </div>
</header>

<div id="alerts"></div>

<div class="plantwrap">
  <div class="plant" id="plant"><svg class="pipes" id="pipes" aria-hidden="true"></svg></div>
</div>

<div class="grid">
  <div class="card">
    <span class="legend">RO Room · Hub 0x00</span>
    <div class="climate" id="cRoom"></div>
  </div>
  <div class="card">
    <span class="legend">Battery Room · Node 0x04</span>
    <div class="climate" id="cBatt"></div>
    <div class="fanrow" id="cBattFan"></div>
  </div>
  <div class="card">
    <span class="legend">Aster NXT 11 · Isolated contacts</span>
    <div class="rows" id="cAster"></div>
  </div>
  <div class="card">
    <span class="legend">Nodes</span>
    <div class="rows" id="cNodes"></div>
  </div>
</div>

<footer>
  <span>Firmware <span class="readout" id="fFw">–</span></span>
  <span>Last reset <span class="readout" id="fReset">–</span></span>
  <span>Bus errors <span class="readout" id="fErr">–</span></span>
  <span>Poll <span class="readout" id="fPoll">–</span></span>
</footer>

<script>
"use strict";
const $ = s => document.querySelector(s);
const SVGNS = "http://www.w3.org/2000/svg";
const el = (t, a = {}, kids = []) => {
  const n = document.createElementNS(SVGNS, t);
  for (const k in a) n.setAttribute(k, a[k]);
  kids.forEach(c => n.appendChild(c));
  return n;
};

/* Telemetry strings originate at RS485 and Wi-Fi nodes — a trust
   boundary. Plain text goes through txt(); authored markup escapes
   every interpolation with esc(). Nothing from the wire reaches
   innerHTML unescaped. */
const ESCAPES = { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" };
const esc = v => String(v).replace(/[&<>"']/g, c => ESCAPES[c]);
const txt = (cls, s) => {
  const d = document.createElement("div");
  d.className = cls;
  d.textContent = s == null ? "" : String(s);
  return d;
};
const node = (cls, html) => {
  const d = document.createElement("div");
  d.className = cls;
  if (html != null) { d.innerHTML = html; }
  return d;
};
const chip = (text, kind) => txt("chip " + (kind || ""), text);
const ago = s => s < 60 ? s + "s" : s < 3600 ? Math.floor(s / 60) + "m" : Math.floor(s / 3600) + "h";
const dur = s => {
  const d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60);
  if (d) return `${d}d ${h}h`;
  if (h) return `${h}h ${m}m`;
  return `${m}m`;
};

/* ── vessel ───────────────────────────────────────────────
   A real container with a living surface: two sine layers drifting at
   different speeds. OFFLINE draws hatch and no liquid — an offline tank
   is not an empty tank (plan.txt §15).                       */
function vessel({ w, h, shape, fluid, pct, state, id }) {
  const AMP = 2.6, LEN = 26, pad = 2;
  const iw = w - pad * 2, ih = h - pad * 2, ry = shape === "cyl" ? Math.min(13, iw * 0.17) : 0;
  const silhouette = shape === "cyl"
    ? `M ${pad} ${pad + ry} A ${iw / 2} ${ry} 0 0 1 ${pad + iw} ${pad + ry}
       L ${pad + iw} ${pad + ih - ry} A ${iw / 2} ${ry} 0 0 1 ${pad} ${pad + ih - ry} Z`
    : `M ${pad + 7} ${pad} L ${pad + iw - 7} ${pad} Q ${pad + iw} ${pad} ${pad + iw} ${pad + 7}
       L ${pad + iw} ${pad + ih - 7} Q ${pad + iw} ${pad + ih} ${pad + iw - 7} ${pad + ih}
       L ${pad + 7} ${pad + ih} Q ${pad} ${pad + ih} ${pad} ${pad + ih - 7}
       L ${pad} ${pad + 7} Q ${pad} ${pad} ${pad + 7} ${pad} Z`;

  const cid = "clip-" + id;
  const svg = el("svg", { width: w, height: h, viewBox: `0 0 ${w} ${h}`, "aria-hidden": "true" });
  const defs = el("defs");
  defs.appendChild(el("clipPath", { id: cid }, [el("path", { d: silhouette })]));

  const hatch = el("pattern", { id: "hatch-" + id, width: 7, height: 7, patternUnits: "userSpaceOnUse", patternTransform: "rotate(45)" });
  hatch.appendChild(el("rect", { width: 7, height: 7, fill: "transparent" }));
  hatch.appendChild(el("line", { x1: 0, y1: 0, x2: 0, y2: 7, stroke: "var(--offline)", "stroke-width": 1.6, opacity: .45 }));
  defs.appendChild(hatch);

  // the additive is marked by texture, not hue alone
  let fillRef = `var(--${fluid})`;
  if (fluid === "additive") {
    const ah = el("pattern", { id: "ah-" + id, width: 9, height: 9, patternUnits: "userSpaceOnUse", patternTransform: "rotate(45)" });
    ah.appendChild(el("rect", { width: 9, height: 9, fill: "var(--additive)" }));
    ah.appendChild(el("line", { x1: 0, y1: 0, x2: 0, y2: 9, stroke: "rgba(0,0,0,.38)", "stroke-width": 3.4 }));
    defs.appendChild(ah);
    fillRef = `url(#ah-${id})`;
  }
  svg.appendChild(defs);
  svg.appendChild(el("path", { d: silhouette, fill: "var(--panel)" }));

  const body = el("g", { "clip-path": `url(#${cid})` });
  if (state === "OFFLINE" || state === "SENSOR_ERROR") {
    body.appendChild(el("rect", { x: 0, y: 0, width: w, height: h, fill: `url(#hatch-${id})` }));
  } else {
    const level = el("g");
    const top = pad + ih - (ih * Math.max(0, Math.min(100, pct)) / 100);
    level.setAttribute("transform", `translate(0 ${top - AMP})`);
    level.style.transition = "transform .9s cubic-bezier(.4,0,.2,1)";
    let d = `M 0 ${AMP}`;
    for (let x = 0; x < w * 2 + LEN; x += LEN)
      d += ` q ${LEN / 4} ${-AMP} ${LEN / 2} 0 q ${LEN / 4} ${AMP} ${LEN / 2} 0`;
    d += ` L ${w * 2 + LEN} ${h + AMP} L 0 ${h + AMP} Z`;
    [[.34, 8.5, 0], [1, 5.5, -LEN / 2]].forEach(([op, sec, off], i) => {
      const drift = el("g", { opacity: op });
      drift.appendChild(el("path", { d, fill: fillRef, transform: `translate(${off} 0)` }));
      drift.style.animation = `wave${i} ${sec}s linear infinite`;
      level.appendChild(drift);
    });
    body.appendChild(level);
  }
  svg.appendChild(body);
  svg.appendChild(el("path", { d: silhouette, fill: "none", stroke: "var(--line-2)", "stroke-width": 1.5 }));
  if (shape === "cyl")
    svg.appendChild(el("ellipse", { cx: w / 2, cy: pad + ry, rx: iw / 2, ry, fill: "none", stroke: "var(--line-2)", "stroke-width": 1.5 }));
  return svg;
}
const kf = document.createElement("style");
kf.textContent = `@keyframes wave0{to{transform:translateX(-26px)}}@keyframes wave1{to{transform:translateX(26px)}}`;
document.head.appendChild(kf);

/* ── machine ──────────────────────────────────────────────
   Static outer group centres it; the inner group rotates about its own
   origin. A CSS transform replaces the SVG transform attribute outright,
   so the two must never live on the same element.             */
function machine({ r, running, dead }) {
  const s = r * 2;
  const svg = el("svg", { width: s, height: s, viewBox: `0 0 ${s} ${s}`, "aria-hidden": "true" });
  svg.appendChild(el("circle", { cx: r, cy: r, r: r - 1.2, fill: "var(--panel)", stroke: dead ? "var(--offline)" : "var(--line-2)", "stroke-width": 1.4 }));
  const hub = el("g", { transform: `translate(${r} ${r})` });
  const g = el("g", { class: "rotor" });
  const col = dead ? "var(--offline)" : running ? "var(--treated)" : "var(--ink-3)";
  for (let i = 0; i < 3; i++)
    g.appendChild(el("path", {
      d: `M 0 0 Q ${r * .34} ${-r * .30} ${r * .60} ${-r * .12}`,
      fill: "none", stroke: col, "stroke-width": 2, "stroke-linecap": "round",
      transform: `rotate(${i * 120})`
    }));
  g.appendChild(el("circle", { cx: 0, cy: 0, r: 2.4, fill: col }));
  hub.appendChild(g);
  svg.appendChild(hub);
  return svg;
}

/* ── unit builders ────────────────────────────────────────── */
function tankUnit(t, cfg) {
  const u = node("unit");
  const v = node("vessel");
  v.dataset.a = cfg.id;
  v.appendChild(vessel({ ...cfg, pct: t.pct, state: t.state }));
  const dead = t.state === "OFFLINE" || t.state === "SENSOR_ERROR";
  if (dead) {
    const p = node("pct");
    p.appendChild(txt("nodata", "NO DATA"));
    v.appendChild(p);
  } else {
    v.appendChild(node("pct", `${t.pct.toFixed(0)}<small>% full</small>`));
  }
  u.appendChild(v);
  u.appendChild(txt("name", cfg.label));
  u.appendChild(txt("sub", dead ? "—" : `${t.distance_mm} mm`));
  let label = t.state, kind = "fault";
  if (t.state === "ONLINE") { label = t.sensor === "OK" ? "Reading" : t.sensor; kind = t.sensor === "OK" ? "on" : "warn"; }
  else if (t.state === "STALE") { kind = "warn"; }
  u.appendChild(chip(label, kind));
  return u;
}

function machineUnit(m, label, id, r) {
  const u = node("unit");
  const dead = m.state && m.state !== "ONLINE";
  const w = node("unit" + (m.on && !dead ? " spin" : ""));
  w.dataset.a = id;
  w.appendChild(machine({ r, running: m.on, dead }));
  u.appendChild(w);
  u.appendChild(txt("name", label));
  let s = "Idle", kind = "off";
  if (dead) { s = "Offline"; kind = "fault"; }
  else if (m.on) { s = "Running"; kind = "on"; }
  u.appendChild(chip(s, kind));
  return u;
}

/* ── orthogonal pipe routing over measured anchors ──────────
   Pipes are drawn after layout from real element rects, so the elevation
   grid can reflow without the pipework drifting off its vessels.  */
function anchorPt(id, side, hostRect) {
  const e = document.querySelector(`[data-a="${id}"]`);
  if (!e) return null;
  const b = e.getBoundingClientRect();
  const x = b.left - hostRect.left, y = b.top - hostRect.top, S = 11;
  if (side === "t") return { x: x + b.width / 2, y: y - S };
  if (side === "b") return { x: x + b.width / 2, y: y + b.height + S };
  if (side === "l") return { x: x - S, y: y + b.height / 2 };
  return { x: x + b.width + S, y: y + b.height / 2 };
}
function routeD(a, as, b, bs) {
  const va = as === "t" || as === "b", vb = bs === "t" || bs === "b";
  if (va && vb) {
    if (Math.abs(a.x - b.x) < 2) return `M ${a.x} ${a.y} L ${b.x} ${b.y}`;
    // elbow near the destination, so risers stay in their own column
    const my = b.y + (a.y > b.y ? 30 : -30);
    return `M ${a.x} ${a.y} L ${a.x} ${my} L ${b.x} ${my} L ${b.x} ${b.y}`;
  }
  if (!va && !vb) {
    if (Math.abs(a.y - b.y) < 2) return `M ${a.x} ${a.y} L ${b.x} ${b.y}`;
    const mx = (a.x + b.x) / 2;
    return `M ${a.x} ${a.y} L ${mx} ${a.y} L ${mx} ${b.y} L ${b.x} ${b.y}`;
  }
  if (va) return `M ${a.x} ${a.y} L ${a.x} ${b.y} L ${b.x} ${b.y}`;
  return `M ${a.x} ${a.y} L ${b.x} ${a.y} L ${b.x} ${b.y}`;
}
let ROUTES = [];
function drawPipes() {
  const host = $("#plant"), svg = $("#pipes");
  if (!host || !svg) return;
  const h = host.getBoundingClientRect();
  svg.setAttribute("width", h.width);
  svg.setAttribute("height", h.height);
  svg.setAttribute("viewBox", `0 0 ${h.width} ${h.height}`);
  svg.textContent = "";
  // injection point: midpoint of the RWP -> HPP run
  const rr = anchorPt("rwp", "r", h), hl = anchorPt("hpp", "l", h);
  const tee = (rr && hl) ? { x: (rr.x + hl.x) / 2, y: rr.y } : null;

  ROUTES.forEach(rt => {
    const a = anchorPt(rt.from, rt.fs, h);
    const b = rt.toTee ? tee : anchorPt(rt.to, rt.ts, h);
    if (!a || !b) return;
    const bs = rt.toTee ? "b" : rt.ts;
    const W = rt.thin ? [7, 5, 2.8, "5 7"] : [11, 8.4, 4.6, "9 11"];
    const common = { d: routeD(a, rt.fs, b, bs), fill: "none", "stroke-linejoin": "round", "stroke-linecap": "butt" };
    svg.appendChild(el("path", { ...common, stroke: "var(--line-2)", "stroke-width": W[0] }));
    svg.appendChild(el("path", { ...common, stroke: "#0C1119", "stroke-width": W[1] }));
    if (rt.flow) svg.appendChild(el("path", {
      ...common, stroke: `var(--${rt.fluid})`, "stroke-width": W[2],
      "stroke-dasharray": W[3], class: "flowing" + (rt.thin ? " thin" : "")
    }));
  });

  if (tee) {
    svg.appendChild(el("circle", { cx: tee.x, cy: tee.y, r: 5.4, fill: "var(--line-2)" }));
    svg.appendChild(el("circle", { cx: tee.x, cy: tee.y, r: 3, fill: "var(--additive)" }));
  }
}

/* ── the plant, in elevation ────────────────────────────── */
function drawPlant(s) {
  const host = $("#plant");
  [...host.children].forEach(c => { if (c.tagName.toLowerCase() !== "svg") c.remove(); });
  const T = s.tanks, P = s.pumps;
  const live = k => P[k].on && P[k].state === "ONLINE";
  const add = (e, col, row) => { e.style.gridColumn = col; e.style.gridRow = row; host.appendChild(e); return e; };
  const cell = (child, col, row) => { const c = node("cell"); c.appendChild(child); return add(c, col, row); };

  // elevation bands, high to low
  [["Roof top", "above RO room", 1], ["Terrace", "RO room · battery room", 2],
   ["Ground floor", "parking", 3], ["Below ground", "borewell", 5]
  ].forEach(([a, b, r]) => add(node("tier", `<b>${esc(a)}</b><span>${esc(b)}</span>`), "lbl", r));

  const room = node("room");
  room.appendChild(txt("tag legend", "RO Room"));
  add(room, "c3 / span 3", 2);

  const grade = node("grade");
  grade.appendChild(txt("legend", "Ground level"));
  add(grade, "1 / -1", 4);

  // roof of the RO room — both storage tanks sit up here
  cell(tankUnit(T.rwt, { w: 122, h: 152, shape: "cyl", fluid: "raw", label: "Raw Water", id: "rwt" }), "c3", 1);
  cell(tankUnit(T.twt, { w: 136, h: 168, shape: "cyl", fluid: "treated", label: "Treated Water", id: "twt" }), "c5", 1);

  // terrace — inside the RO room
  cell(machineUnit(P.rwp, "RWP", "rwp", 29), "c3", 2).classList.add("top");
  cell(tankUnit(T.dosing, { w: 82, h: 96, shape: "cyl", fluid: "additive", label: "Dosing", id: "dos" }), "c4", 2).classList.add("bottom");
  cell(machineUnit(P.hpp, "HPP", "hpp", 29), "c5", 2).classList.add("top");

  // terrace — beside the RO room
  const B = s.env.battery_room;
  const annex = node("annex");
  annex.appendChild(txt("tag legend", "Battery Room"));
  const ab = node("unit");
  const fanU = node("unit" + (B.fan ? " spin fast" : ""));
  fanU.appendChild(machine({ r: 27, running: B.fan, dead: B.state !== "ONLINE" }));
  ab.appendChild(fanU);
  ab.appendChild(txt("name", "Exhaust Fan"));
  ab.appendChild(txt("sub", B.state === "ONLINE" ? `${B.t.toFixed(1)} °C · ${B.rh.toFixed(0)} %` : "—"));
  let bt = "Off", bk = "off";
  if (B.state !== "ONLINE") { bt = "Offline"; bk = "fault"; }
  else if (B.fan) { bt = "Running"; bk = "on"; }
  ab.appendChild(chip(bt, bk));
  annex.appendChild(ab);
  add(annex, "c6", 2);

  // ground floor
  cell(tankUnit(T.sump, { w: 126, h: 148, shape: "box", fluid: "raw", label: "Sump", id: "sump" }), "c1", 3);
  cell(machineUnit(P.sump_motor, "Sump Motor", "smotor", 30), "c2", 3);

  // below grade
  cell(machineUnit(P.borewell, "Borewell Pump", "bore", 30), "c1", 5);

  ROUTES = [
    { from: "bore",   fs: "t", to: "sump",   ts: "b", fluid: "raw",     flow: live("borewell") },
    { from: "sump",   fs: "r", to: "smotor", ts: "l", fluid: "raw",     flow: live("sump_motor") },
    { from: "smotor", fs: "t", to: "rwt",    ts: "l", fluid: "raw",     flow: live("sump_motor") },
    { from: "rwt",    fs: "b", to: "rwp",    ts: "t", fluid: "raw",     flow: live("rwp") },
    { from: "rwp",    fs: "r", to: "hpp",    ts: "l", fluid: "raw",     flow: live("rwp") },
    { from: "dos",    fs: "t", toTee: true,            fluid: "additive", flow: live("rwp"), thin: true },
    { from: "hpp",    fs: "t", to: "twt",    ts: "b", fluid: "treated", flow: live("hpp") },
  ];
  requestAnimationFrame(drawPipes);
}

/* ── panels ───────────────────────────────────────────────── */
function climate(host, c) {
  host.textContent = "";
  if (c.state !== "ONLINE") {
    const m = node("metric", `<span class="legend">Sensor</span>`);
    m.appendChild(chip(c.state, "fault"));
    host.appendChild(m);
    return;
  }
  host.appendChild(node("metric", `<span class="legend">Temperature</span><span class="big">${c.t.toFixed(1)}<u>°C</u></span>`));
  host.appendChild(node("metric", `<span class="legend">Humidity</span><span class="big">${c.rh.toFixed(0)}<u>%</u></span>`));
  const foot = node("srcline", `<span class="legend">${esc(c.src)}</span>`);
  foot.appendChild(chip(c.age_s <= 10 ? "Fresh" : "Stale " + ago(c.age_s), c.age_s <= 10 ? "on" : "warn"));
  host.appendChild(foot);
}
function rows(host, list) {
  host.textContent = "";
  list.forEach(([k, label, kind, note]) => {
    const r = node("row");
    r.appendChild(txt("k", k));
    const v = node("v");
    if (note) v.appendChild(txt("n", note));
    v.appendChild(chip(label, kind));
    r.appendChild(v);
    host.appendChild(r);
  });
}

function drawAlerts(s) {
  const out = [], T = s.tanks;
  if (T.sump.state === "ONLINE" && T.sump.pct < 15)
    out.push(["fault", "Dry run risk", "Sump below 15 percent. Sump motor should be held off until it recovers.", "Sump"]);
  [["sump", "Sump"], ["rwt", "Raw Water"], ["twt", "Treated Water"]].forEach(([k, n]) => {
    if (T[k].state === "ONLINE" && T[k].pct > 95) out.push(["warn", "Overflow risk", `${n} above 95 percent.`, n]);
  });
  if (T.dosing.state === "ONLINE" && T.dosing.pct < 20)
    out.push(["warn", "Chemical low", "Dosing tank below 20 percent. Replenish anti-scalant.", "Dosing"]);
  if (s.aster.alarm)
    out.push(["fault", "Controller alarm", "Aster NXT 11 alarm contact is active. Check LPS and HPS pressure switches.", "RO Room"]);
  if (s.env.battery_room.state === "ONLINE" && s.env.battery_room.t > 38)
    out.push(["warn", "Battery room hot", `Room at ${s.env.battery_room.t.toFixed(1)} °C. Exhaust fan ${s.env.battery_room.fan ? "running" : "is off"}.`, "Battery Room"]);
  s.nodes.filter(n => n.state === "OFFLINE").forEach(n =>
    out.push(["warn", "Node offline", `The ${n.role} node has not answered for ${ago(n.age_s)}.`, n.id]));

  const host = $("#alerts");
  host.textContent = "";
  out.forEach(([kind, title, body, where]) =>
    host.appendChild(node("alert " + kind,
      `<b>${esc(title)}</b><span>${esc(body)}</span><span class="where">${esc(where)}</span>`)));
}

function render(s) {
  drawAlerts(s);
  drawPlant(s);
  climate($("#cRoom"), s.env.ro_room);
  climate($("#cBatt"), s.env.battery_room);

  const B = s.env.battery_room, fh = $("#cBattFan");
  fh.textContent = "";
  const fw = node("unit" + (B.fan ? " spin fast" : ""));
  fw.appendChild(machine({ r: 21, running: B.fan, dead: B.state !== "ONLINE" }));
  fh.appendChild(fw);
  const ftxt = node("txtblk", `<span class="legend">Exhaust fan</span>`);
  let ft = "Off", fk = "off";
  if (B.state !== "ONLINE") { ft = "Unknown"; fk = "fault"; }
  else if (B.fan) { ft = "Running"; fk = "on"; }
  ftxt.appendChild(chip(ft, fk));
  fh.appendChild(ftxt);

  const A = s.aster;
  rows($("#cAster"), [
    ["TWT FLOTY", A.twt_floty ? "Closed" : "Open", A.twt_floty ? "on" : "off"],
    ["RWT FLOTY", A.rwt_floty ? "Closed" : "Open", A.rwt_floty ? "on" : "off"],
    ["SUMP FLOTY", A.sump_floty ? "Closed" : "Open", A.sump_floty ? "on" : "off"],
    ["DOS LVL", A.dos_lvl ? "Closed" : "Open", A.dos_lvl ? "on" : "off"],
    ["RL1", A.rl1 ? "Active" : "Inactive", A.rl1 ? "on" : "off"],
    ["RL2", A.rl2 ? "Active" : "Inactive", A.rl2 ? "on" : "off"],
    ["ALARM", A.alarm ? "Active" : "Clear", A.alarm ? "fault" : "off"],
  ]);
  rows($("#cNodes"), s.nodes.map(n => {
    let label = "Offline", kind = "fault";
    if (n.state === "ONLINE") { label = "Online"; kind = "on"; }
    else if (n.state === "STALE") { label = "Stale"; kind = "warn"; }
    return [`${n.id}  ${n.role}`, label, kind, `${n.link} · ${ago(n.age_s)}`];
  }));

  $("#hBus").textContent = `${s.rs485.online}/${s.rs485.total}`;
  $("#hRssi").textContent = `${s.sys.rssi} dBm`;
  $("#hUp").textContent = dur(s.sys.uptime_s);
  $("#hClock").textContent = new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" });
  $("#fFw").textContent = s.sys.fw;
  $("#fReset").textContent = s.sys.reset_reason;
  $("#fErr").textContent = s.rs485.errors;
  $("#fPoll").textContent = s.rs485.last_poll_ms + " ms";
}
new ResizeObserver(drawPipes).observe(document.documentElement);

/* ── demo simulator ───────────────────────────────────────────
   Runs until /api/telemetry answers. Models the failure this project
   exists to fix: the borewell goes dry, the sump drains, and the sump
   motor keeps lifting because RWT is still below its float.    */
const demo = {
  sys: { uptime_s: 267340, rssi: -58, fw: "0.4.0-dev", reset_reason: "Power on" },
  rs485: { online: 4, total: 4, errors: 3, last_poll_ms: 412 },
  tanks: {
    sump:   { pct: 46, distance_mm: 1890, state: "ONLINE", sensor: "OK" },
    rwt:    { pct: 38, distance_mm: 1240, state: "ONLINE", sensor: "OK" },
    dosing: { pct: 17, distance_mm: 452,  state: "ONLINE", sensor: "OK" },
    twt:    { pct: 71, distance_mm: 640,  state: "ONLINE", sensor: "OK" },
  },
  pumps: {
    borewell:   { on: true, state: "ONLINE" },
    sump_motor: { on: true, state: "ONLINE" },
    rwp:        { on: true, state: "ONLINE" },
    hpp:        { on: true, state: "ONLINE" },
  },
  aster: { twt_floty: false, rwt_floty: true, sump_floty: false, dos_lvl: true, rl1: true, rl2: true, alarm: false },
  env: {
    ro_room:      { t: 31.4, rh: 62, state: "ONLINE", src: "SHT30 · I2C 0x44", age_s: 2 },
    battery_room: { t: 36.2, rh: 48, fan: false, state: "ONLINE", src: "SHT30 · Node 0x04", age_s: 1 },
  },
  nodes: [
    { id: "0x01", role: "Dosing", link: "RS485", state: "ONLINE", age_s: 1 },
    { id: "0x02", role: "Raw Water", link: "RS485", state: "ONLINE", age_s: 1 },
    { id: "0x03", role: "Treated Water", link: "RS485", state: "ONLINE", age_s: 2 },
    { id: "0x04", role: "Battery Room", link: "RS485", state: "ONLINE", age_s: 1 },
    { id: "0x05", role: "Sump", link: "Wi-Fi", state: "ONLINE", age_s: 3 },
    { id: "0x06", role: "Motors", link: "Wi-Fi", state: "OFFLINE", age_s: 94 },
  ],
};
let tick = 0;
function stepDemo() {
  const d = demo, T = d.tanks;
  tick++;
  d.sys.uptime_s += 2;
  d.nodes.forEach(n => { if (n.state === "OFFLINE") n.age_s += 2; });

  if (d.pumps.borewell.on) T.sump.pct += 0.55;
  if (d.pumps.sump_motor.on) { T.sump.pct -= 1.5; T.rwt.pct += 0.8; }
  if (d.pumps.rwp.on) { T.rwt.pct -= 0.35; T.dosing.pct -= 0.06; }
  if (d.pumps.hpp.on) T.twt.pct += 0.30;
  T.twt.pct -= 0.22;

  if (tick === 22) d.pumps.borewell.on = false;        // the borewell runs dry
  if (tick === 70) { d.pumps.borewell.on = true; T.dosing.pct = 84; tick = 0; }

  d.pumps.sump_motor.on = T.rwt.pct < 72;              // driven by the RWT float, as wired today
  d.pumps.rwp.on = T.rwt.pct > 8 && T.twt.pct < 94;
  d.pumps.hpp.on = d.pumps.rwp.on;
  d.env.battery_room.t = 36.6 + Math.sin(tick / 9) * 2.4;
  d.env.battery_room.fan = d.env.battery_room.t > 38;
  d.env.ro_room.t = 31.4 + Math.sin(tick / 14) * 0.8;
  d.aster.rwt_floty = T.rwt.pct < 72;
  d.aster.twt_floty = T.twt.pct > 94;
  d.aster.dos_lvl = T.dosing.pct > 12;

  for (const k in T) {
    T[k].pct = Math.max(0, Math.min(100, T[k].pct));
    T[k].distance_mm = Math.round(2400 - T[k].pct * 18);
  }
  render(d);
}

/* ── live ─────────────────────────────────────────────────── */
let demoTimer = null;
async function poll() {
  try {
    const r = await fetch("/api/telemetry", { cache: "no-store" });
    if (!r.ok) throw new Error("telemetry " + r.status);
    const s = await r.json();
    if (demoTimer) { clearInterval(demoTimer); demoTimer = null; }
    const m = $("#mode");
    m.textContent = "Live";
    m.classList.add("live");
    render(s);
  } catch {
    if (!demoTimer) { demoTimer = setInterval(stepDemo, 2000); stepDemo(); }
  }
}
poll();
setInterval(poll, 1000);
</script>
