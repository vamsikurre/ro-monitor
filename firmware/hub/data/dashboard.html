<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Varenyam · RO Plant</title>
<style>
/* ─────────────────────────────────────────────────────────────
   RO-MONITOR — PLANT ELEVATION DASHBOARD
   Self-contained. No external requests — the hub is LAN-only.
   Palette validated against dataviz six-checks (dark, surface #18202C).

   Drawn as a true elevation, because the lift is the point: this plant
   fails by pumping dry from the lowest vessel to the highest.
     Roof of RO room ...... RWT, TWT
     Terrace .............. RO room (RWP, Dosing, HPP) + Battery Room
     Ground / parking ..... Sump, Sump Motor
     Below grade .......... Borewell
   ───────────────────────────────────────────────────────────── */
:root{
  --ground-c:#10161F; --panel:#18202C; --line:#2A3646; --line-2:#3E4E63;
  --ink:#E6ECF3; --ink-2:#9AA7B8; --ink-3:#6B7787;
  /* fluids — categorical, ΔE 17.8 normal / 17.3 deutan */
  --raw:#3E8F5F; --treated:#2B8FD4; --additive:#9A7B3C;
  /* TDS readouts. Deliberately NOT the vessel fluid colours: those say what is
     in the tank, these say how clean it is. Orange on the feed, green on the
     permeate, so a glance down the plant reads dirty -> clean. */
  --tds-feed:#C4703A; --tds-clean:#3E8F5F;
  /* status — reserved, never a fluid. ΔE 22.4 normal / 10.0 deutan */
  --warn:#B08F1A; --fault:#D93E68; --offline:#6B7787;
  /* --fault at low alpha, for washing a whole region rather than a chip */
  --fault-wash:rgba(217,62,104,.06); --fault-wash-2:rgba(217,62,104,.19);
  --ui:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono","Cascadia Mono","Segoe UI Mono",Menlo,Consolas,"Liberation Mono",monospace;
  --r:3px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--ground-c); color:var(--ink); font-family:var(--ui);
  font-size:15px; line-height:1.45; padding:0 0 40px; font-variant-numeric:tabular-nums;
}
.legend{font-size:10px; font-weight:600; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-3); white-space:nowrap}
.readout{font-family:var(--mono); font-variant-numeric:tabular-nums; font-weight:600}

/* ── header ─────────────────────────────────────────────── */
header{
  display:flex; flex-wrap:wrap; align-items:baseline; gap:8px 22px;
  padding:16px 22px; border-bottom:1px solid var(--line); background:var(--panel);
  position:sticky; top:0; z-index:30;
}
h1{font-size:15px; font-weight:600; letter-spacing:.08em; text-transform:uppercase}
h1 span{color:var(--ink-3); font-weight:400}
.hstats{display:flex; flex-wrap:wrap; gap:6px 20px; margin-left:auto; align-items:baseline}
.hstat{display:flex; gap:7px; align-items:baseline}
.hstat .readout{font-size:13px; color:var(--ink)}
.mode{
  font-family:var(--mono); font-size:10px; letter-spacing:.1em; text-transform:uppercase;
  border:1px solid var(--line); border-radius:100px; padding:3px 10px; color:var(--ink-2);
  display:inline-flex; align-items:center; gap:7px;
}
.mode::before{content:""; width:6px; height:6px; border-radius:50%; background:var(--ink-3); animation:beat 2.6s ease-in-out infinite}
.mode.live::before{background:var(--treated)}
@keyframes beat{0%,100%{opacity:1}50%{opacity:.25}}

/* ── alerts ─────────────────────────────────────────────── */
/* Fixed, so an alert appearing or clearing never resizes the plant. */
#alerts{
  position:fixed; right:22px; bottom:18px; z-index:25;
  width:min(580px,calc(100vw - 44px));
  display:flex; flex-direction:column; gap:8px; pointer-events:none;
}
.alert{
  display:flex; gap:12px; align-items:baseline; padding:9px 13px 9px 13px;
  border-radius:2px; border:1px solid var(--line-2); font-size:13px;
  background:color-mix(in srgb,var(--ground-c) 58%,transparent);
  -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px);
  pointer-events:auto; position:relative; padding-left:22px;
}
/* hatched leading edge, same language as the structural slabs */
.alert::before{
  content:""; position:absolute; left:0; top:0; bottom:0; width:10px;
  border-right:1px solid var(--line-2);
  background:repeating-linear-gradient(45deg,transparent 0 3px,var(--line-2) 3px 4px);
}
.alert.warn::before{background:repeating-linear-gradient(45deg,transparent 0 3px,var(--warn) 3px 4px)}
.alert.fault::before{background:repeating-linear-gradient(45deg,transparent 0 3px,var(--fault) 3px 4px)}
.alert .x{
  flex:none; margin-left:4px; width:20px; height:20px; line-height:1; cursor:pointer;
  background:transparent; border:1px solid var(--line-2); border-radius:0;
  color:var(--ink-3); font:14px/1 var(--ui); align-self:center; padding:0;
}
.alert .x:hover{color:var(--ink); border-color:var(--line-2)}
.alert b{font-family:var(--mono); font-size:10px; letter-spacing:.12em; text-transform:uppercase; flex:none}
.alert.warn{border-color:color-mix(in srgb,var(--warn) 42%,var(--line-2))}
.alert.warn b{color:var(--warn)}
.alert.fault{border-color:color-mix(in srgb,var(--fault) 42%,var(--line-2))}
.alert.fault b{color:var(--fault)}
.alert .where{color:var(--ink-2); margin-left:auto; font-size:12px; flex:none}

/* ── the plant, in elevation (signature) ────────────────── */
.plantwrap{padding:26px 22px 8px; overflow:hidden}
.plant{
  position:relative; display:grid; min-width:1240px; transform-origin:top left;
  grid-template-columns:[lbl] 108px [c1] 2fr [c2] .8fr [c3] 1.2fr [c4] 1.32fr [c5] 1fr [c6] 1.2fr [c7] 1.9fr [c8] 2.1fr;
  grid-template-rows:minmax(326px,auto) minmax(396px,auto) auto 0 auto;
  row-gap:32px;
}
.plant > svg.pipes{position:absolute; inset:0; z-index:0; pointer-events:none; overflow:visible}
.cell{display:flex; justify-content:center; align-items:center; position:relative; z-index:2; min-width:0}
.cell.top{align-items:flex-start}
.cell.line .unit > [data-a]{
  height:152px; display:flex; align-items:center; justify-content:center;
}
.glyph{position:relative; display:flex; align-items:center; justify-content:center}
.chipgap{height:19px}
.cell.bottom{align-items:flex-end}

/* elevation band label — encodes real building height, not decoration */
.tier{grid-column:lbl; display:flex; flex-direction:column; gap:3px; justify-content:center; align-items:flex-start; position:relative; z-index:2}
.tier.top{justify-content:flex-start}
.tier.bot{justify-content:flex-end}
.tier b{font-size:11px; font-weight:600; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-2)}
.tier span{font-size:10.5px; color:var(--ink-3)}

/* the RO room, with both roof tanks resting on it */
.room{grid-row:2; border:1px solid var(--line-2); border-bottom:0; border-radius:2px 2px 0 0; margin:-18px -12px -21px; position:relative; z-index:1}
.room > .tag{position:absolute; top:-8px; left:14px; background:var(--ground-c); padding:0 8px}

/* Controller fault: the whole room reads as faulted, not just one row in the
   alert list. The Aster multiplexes every condition onto a single contact, so
   this says "something in here has tripped" and the panel says which.

   The static state already carries the fault colour and the pulse is only
   emphasis on top of it. That ordering matters: the reduced-motion rule further
   down switches every animation off, and a fault that was visible ONLY as a
   flash would silently stop being visible for anyone who set that preference.

   ~0.9 Hz, deliberately under the 3 Hz photosensitivity threshold. */
.room.alarm{
  border-color:var(--fault); background:var(--fault-wash);
  animation:roomalarm 1.1s ease-in-out infinite;
}
.room.alarm > .tag{color:var(--fault)}
@keyframes roomalarm{
  0%,100%{background:var(--fault-wash)}
  50%{background:var(--fault-wash-2)}
}

/* Current draw, under a pump that has a clamp fitted. Mono and small: it is a
   secondary reading, not the unit's identity. */
.amps{
  font-family:var(--mono); font-size:12px; font-weight:600;
  color:var(--ink-2); margin-top:3px; letter-spacing:-.01em;
}
.amps u{text-decoration:none; font-size:10px; color:var(--ink-3); font-weight:600; margin-left:2px}

/* TDS above a tank. Same weight as .amps under a pump - a secondary reading
   attached to a vessel, not the vessel's identity. */
.tds{
  font-family:var(--mono); font-size:12px; font-weight:600;
  letter-spacing:-.01em; margin-bottom:2px; text-align:center;
}
.tds u{text-decoration:none; font-size:10px; color:var(--ink-3); font-weight:600; margin-left:2px}
.tds.feed{color:var(--tds-feed)}
.tds.clean{color:var(--tds-clean)}
/* No probe, or a probe that has stopped answering: greyed, so it reads as an
   absent measurement rather than a clean one. */
.tds.none{color:var(--ink-3); font-weight:500}
.amps.over{color:var(--fault)}
.room > .roomenv,.annex > .roomenv{
  position:absolute; bottom:12px; right:14px; display:flex; align-items:baseline; gap:12px;
  background:var(--ground-c); padding:4px 9px; border-radius:3px;
}
.annex > .roomenv{gap:9px; right:10px}
.annex .vals{font-size:16px}
.roomenv > .legend{align-self:center}
.roomenv .vals{font-family:var(--mono); font-weight:700; font-size:18px; color:var(--ink); letter-spacing:-.02em}
.roomenv .vals u{text-decoration:none; font-size:11px; color:var(--ink-2); font-weight:600; margin-left:2px}

/* battery room — beside the RO room on the terrace, not in the water path */
.annex{grid-row:2; border:1px dashed var(--line-2); border-bottom:0; border-radius:2px 2px 0 0; margin:-18px 0 -21px; position:relative; z-index:1; display:flex; align-items:center; justify-content:center}
.annex > .tag{position:absolute; top:-8px; left:13px; background:var(--ground-c); padding:0 8px}

/* Structural slabs, hatched the way concrete reads in a section. Each
   sits in the gap below its level, so the equipment stands on a floor. */
.slab{
  grid-column:1 / -1; align-self:end; height:9px; margin-bottom:-21px; z-index:0;
  border-top:1px solid var(--line-2); border-bottom:1px solid var(--line);
  background:repeating-linear-gradient(45deg,
    transparent 0 3px, color-mix(in srgb,var(--line-2) 50%,transparent) 3px 4px);
}
.slab.grade{border-top-width:2px; margin-bottom:-19px}
.slab.roof{margin-left:-14px}

/* earth below grade */
.earth{
  grid-column:1 / -1; grid-row:5; align-self:stretch; position:relative; z-index:0;
  margin:-44px -14px -14px -14px;
  background:repeating-linear-gradient(45deg,
    transparent 0 7px, color-mix(in srgb,var(--line) 85%,transparent) 7px 8px);
}
.earth > .legend{position:absolute; top:-7px; right:16px; background:var(--ground-c); padding:0 9px}

/* Scenery. Occupied space reads as a building; empty space reads as a
   diagram. These are wireframe only, dimmed, and never interactive. */
.ymark{position:absolute; left:0; right:0; height:1px; pointer-events:none}
.subpump{position:absolute; left:0; right:0; bottom:7px; display:flex; justify-content:center; z-index:1}
.subcap{display:flex; align-items:center; gap:9px; margin-top:1px}

.scenery{
  align-self:end; z-index:0; display:flex; align-items:flex-end;
  pointer-events:none; opacity:.42; margin-bottom:-12px;
}
.scenery.cars{justify-content:space-evenly; padding:0 18px; margin-bottom:-10px}
.scenery.plants{justify-content:space-between; padding:0 12px}

/* Two tilted PV rows on the roof, one over each storage tank, low at
   the left and high at the right, with a small gap between the rows.
   The panel stretches with its columns while its vertical geometry is
   fixed, so the posts stay put and the gap holds at any width. */
.solar{grid-row:1; align-self:stretch; position:relative; z-index:0; opacity:.85}
.solar.rowA{margin-left:-46px; margin-right:9px}
.solar.rowB{margin-left:9px}
.solar .post{
  position:absolute; bottom:0; width:7px;
  border-left:1px solid var(--line-2); border-right:1px solid var(--line-2);
}
.solar .post::after{
  content:""; position:absolute; left:-7px; right:-7px; bottom:0;
  border-bottom:2px solid var(--line-2);
}
.solar .tie{
  position:absolute; left:10%; width:80%; bottom:36px; height:0;
  border-top:1px solid color-mix(in srgb,var(--line-2) 70%,transparent);
}
.solar > .legend{position:absolute; top:2px; left:2px; background:var(--ground-c); padding:0 6px}

/* level marker, as on an architectural elevation */
.tier b::before{
  content:""; display:inline-block; width:7px; height:7px; margin-right:8px;
  border:1px solid var(--line-2); transform:rotate(45deg); vertical-align:middle;
}

.flowing{animation:dash 1.15s linear infinite}
@keyframes dash{to{stroke-dashoffset:-20}}
.flowing.thin{animation:dash-thin 1.6s linear infinite}
@keyframes dash-thin{to{stroke-dashoffset:-12}}

/* ── units ──────────────────────────────────────────────── */
.unit{display:flex; flex-direction:column; align-items:center; gap:8px; min-width:0}
.unit > *{max-width:100%}
.unit .name{font-size:11px; font-weight:600; letter-spacing:.1em; text-transform:uppercase; text-align:center;
  background:var(--ground-c); padding:1px 8px; border-radius:2px}
.unit .sub{font-size:11px; color:var(--ink-2); font-family:var(--mono); text-align:center;
  background:var(--ground-c); padding:1px 8px; border-radius:2px}
.vessel{position:relative}

/* A roof tank stands ON the slab.
   .cell.bottom aligns the whole UNIT to the row bottom, and the unit is vessel +
   name + distance + chip - so the caption block was propping both roof tanks
   about 80px into the air above their own roof. Lifting the caption out of the
   vertical flow drops the vessel onto the slab and hangs the labels below the
   roof line, which is already how the sump reads against grade.
   The labels then sit over the room interior and over the riser that leaves the
   tank, so they get the same solid ground-coloured patch .roomenv uses for
   exactly this reason. */
.cell.onslab > .unit{position:relative}
.cell.onslab > .unit > .caption{
  position:absolute; top:100%; left:50%; transform:translateX(-50%);
  margin-top:9px; white-space:nowrap; z-index:3;
  display:flex; flex-direction:column; align-items:center; gap:6px;
  background:var(--ground-c); padding:4px 9px; border-radius:3px;
}
.caption{display:flex; flex-direction:column; align-items:center; gap:8px}

/* A vessel that fills its grid span rather than sitting centred in it. The TWT is
   a poured concrete tank running to the end of the roof slab, so it is drawn to
   the edge instead of as a centred object with air either side.
   The SVG keeps its designed HEIGHT and stretches only horizontally
   (preserveAspectRatio="none" on the element). For a box that is nearly free:
   the corner arcs widen slightly and the surface wave gets a longer wavelength,
   which is what a bigger tank should look like anyway. It would be wrong on a
   cylinder, where the end ellipses would go visibly oval - hence the flag rather
   than making every vessel stretch. */
/* .cell is a flex container, so justify-content:stretch would be ignored - it is
   not a valid value there. Width on the item is what actually fills the span. */
.cell.wide > .unit{width:100%}
.cell.wide .vessel{width:100%}
.cell.wide .glyph{width:100%}
.cell.wide .glyph > svg{width:100%}
.vessel .pct{
  position:absolute; left:0; right:0; top:9%; text-align:center;
  font-family:var(--mono); font-weight:700; font-size:22px; letter-spacing:-.02em;
  text-shadow:0 1px 6px rgba(0,0,0,.8); pointer-events:none;
}
.vessel .pct small{display:block; font-size:10px; font-weight:600; letter-spacing:.1em; opacity:.72; margin-top:1px}
.vessel .nodata{font-size:12px; letter-spacing:.1em; color:var(--ink-3)}
.chip{
  font-family:var(--mono); font-size:9.5px; letter-spacing:.11em; text-transform:uppercase;
  padding:2px 7px; border-radius:100px; border:1px solid var(--line); color:var(--ink-2);
  display:inline-block; white-space:nowrap; background:var(--ground-c);
}
.chip.on{color:var(--ink); border-color:color-mix(in srgb,var(--treated) 60%,transparent)}
.chip.warn{color:var(--warn); border-color:color-mix(in srgb,var(--warn) 55%,transparent)}
.chip.fault{color:var(--fault); border-color:color-mix(in srgb,var(--fault) 55%,transparent)}
.chip.off{color:var(--ink-3)}
.rotor{transform-origin:0 0}
.spin .rotor{animation:spin 2.6s linear infinite}
.fast .rotor{animation-duration:1.5s}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── instrument strip ───────────────────────────────────── */
.grid{display:grid; gap:14px; padding:20px 22px 0; grid-template-columns:repeat(auto-fit,minmax(268px,1fr))}
.card{background:var(--panel); border:1px solid var(--line); border-radius:var(--r); padding:14px 15px}
.card > .legend{display:block; margin-bottom:12px; padding-bottom:9px; border-bottom:1px solid var(--line)}
.climate{display:flex; align-items:flex-end; gap:20px; flex-wrap:wrap}
.big{font-family:var(--mono); font-weight:700; font-size:31px; letter-spacing:-.025em; line-height:1}
.big u{text-decoration:none; font-size:15px; color:var(--ink-2); font-weight:600; margin-left:2px}
.metric{display:flex; flex-direction:column; gap:5px}
.fanrow{display:flex; align-items:center; gap:13px; margin-top:14px; padding-top:13px; border-top:1px solid var(--line)}
.fanrow .txtblk{display:flex; flex-direction:column; gap:6px; align-items:flex-start}
.srcline{flex-basis:100%; display:flex; align-items:center; gap:11px; margin-top:14px; padding-top:12px; border-top:1px solid var(--line)}
.rows{display:flex; flex-direction:column}
.row{display:flex; align-items:center; gap:12px; padding:7px 0; border-bottom:1px solid color-mix(in srgb,var(--line) 55%,transparent)}
.row:last-child{border-bottom:0}
.row .k{font-size:12px; letter-spacing:.05em; color:var(--ink-2); font-family:var(--mono)}
.row .v{margin-left:auto; display:flex; align-items:center; gap:9px}
.row .n{font-family:var(--mono); font-size:12px; color:var(--ink-2)}
footer{padding:20px 22px 0; color:var(--ink-3); font-size:11.5px; display:flex; flex-wrap:wrap; gap:6px 20px}

/* Narrow screens keep the elevation and scroll sideways. Flattening it
   would throw away the one thing the drawing exists to show. */
@media (max-width:900px){
  header,.grid,footer,.plantwrap{padding-left:16px; padding-right:16px}
  #alerts{right:16px; bottom:14px; width:calc(100vw - 32px)}
  .hstats{margin-left:0; width:100%; gap:4px 15px}
  .hstat .readout{font-size:12px}
  header{gap:7px 15px; padding-top:13px; padding-bottom:13px}
  .plantwrap{overflow-x:visible}
}
/* Linear stack: one unit per row in process order, dosing on a side
   branch. Elevation moves off the band labels and onto each unit. */
.plant.narrow{
  min-width:0; row-gap:40px;
  grid-template-columns:[main] minmax(0,1.15fr) [branch] minmax(0,1fr);
  grid-template-rows:none;
}
.plant.narrow .tier,.plant.narrow .grade{display:none}
.plant.narrow .cell{align-items:center}
.plant.narrow .room{margin:-16px -8px}
.plant.narrow .annex{margin:0}
.plant.narrow .room > .roomenv{top:auto; bottom:10px; right:11px; gap:9px}
.plant.narrow .roomenv > .legend{display:none}
.plant.narrow .roomenv .vals{font-size:14px}
.unit.passive .name{color:var(--ink-2)}
.unit .loc{
  font-size:9.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-3);
  background:var(--ground-c); padding:1px 7px; border-radius:2px;
}

:focus-visible{outline:2px solid var(--treated); outline-offset:2px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important; transition:none!important}}
</style>
</head>
<body>

<header>
  <h1>Varenyam <span>/ RO Plant · Elevation</span></h1>
  <span class="mode" id="mode">Demo data</span>
  <div class="hstats">
    <div class="hstat"><span class="legend">Bus</span><span class="readout" id="hBus">–</span></div>
    <div class="hstat"><span class="legend">Signal</span><span class="readout" id="hRssi">–</span></div>
    <div class="hstat"><span class="legend">Uptime</span><span class="readout" id="hUp">–</span></div>
    <div class="hstat"><span class="legend">Updated</span><span class="readout" id="hClock">–</span></div>
  </div>
</header>

<div id="alerts"></div>

<div class="plantwrap">
  <div class="plant" id="plant"><svg class="pipes" id="pipes" aria-hidden="true"></svg></div>
</div>

<div class="grid">
  <div class="card">
    <span class="legend">RO Room · Hub 0x00</span>
    <div class="climate" id="cRoom"></div>
  </div>
  <div class="card">
    <span class="legend">Battery Room · Node 0x04</span>
    <div class="climate" id="cBatt"></div>
    <div class="fanrow" id="cBattFan"></div>
  </div>
  <div class="card">
    <span class="legend">Water Quality · TDS</span>
    <div class="rows" id="cQuality"></div>
  </div>
  <div class="card">
    <span class="legend">Aster NXT 11 · Isolated contacts</span>
    <div class="rows" id="cAster"></div>
  </div>
  <div class="card">
    <span class="legend">Nodes</span>
    <div class="rows" id="cNodes"></div>
  </div>
</div>

<footer>
  <span>Firmware <span class="readout" id="fFw">–</span></span>
  <span>Last reset <span class="readout" id="fReset">–</span></span>
  <span>Bus errors <span class="readout" id="fErr">–</span></span>
  <span>Poll <span class="readout" id="fPoll">–</span></span>
</footer>

<script>
"use strict";
const $ = s => document.querySelector(s);
const SVGNS = "http://www.w3.org/2000/svg";
const el = (t, a = {}, kids = []) => {
  const n = document.createElementNS(SVGNS, t);
  for (const k in a) n.setAttribute(k, a[k]);
  kids.forEach(c => n.appendChild(c));
  return n;
};

/* Telemetry strings originate at RS485 and Wi-Fi nodes — a trust
   boundary. Plain text goes through txt(); authored markup escapes
   every interpolation with esc(). Nothing from the wire reaches
   innerHTML unescaped. */
const ESCAPES = { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" };
const esc = v => String(v).replace(/[&<>"']/g, c => ESCAPES[c]);
const txt = (cls, s) => {
  const d = document.createElement("div");
  d.className = cls;
  d.textContent = s == null ? "" : String(s);
  return d;
};
const node = (cls, html) => {
  const d = document.createElement("div");
  d.className = cls;
  if (html != null) { d.innerHTML = html; }
  return d;
};
const chip = (text, kind) => txt("chip " + (kind || ""), text);
const ago = s => s < 60 ? s + "s" : s < 3600 ? Math.floor(s / 60) + "m" : Math.floor(s / 3600) + "h";
const dur = s => {
  const d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60);
  if (d) return `${d}d ${h}h`;
  if (h) return `${h}h ${m}m`;
  return `${m}m`;
};

/* ── vessel ───────────────────────────────────────────────
   A real container with a living surface: two sine layers drifting at
   different speeds. OFFLINE draws hatch and no liquid — an offline tank
   is not an empty tank (plan.txt §15).                       */
function vessel({ w, h, shape, fluid, pct, state, id, stretch, corner }) {
  const AMP = 4.6, LEN = 26, pad = 2;
  const iw = w - pad * 2, ih = h - pad * 2, ry = shape === "cyl" ? Math.min(13, iw * 0.17) : 0;
  // Box corner radius. Poured concrete has sharp corners, and on a stretched
  // vessel the arc widens with the stretch factor - 7 became a visible oval and
  // the tank read as a swimming pool. Per-vessel so the moulded sump keeps its 7.
  const cr = (corner === undefined) ? 7 : corner;
  const silhouette = shape === "cyl"
    ? `M ${pad} ${pad + ry} A ${iw / 2} ${ry} 0 0 1 ${pad + iw} ${pad + ry}
       L ${pad + iw} ${pad + ih - ry} A ${iw / 2} ${ry} 0 0 1 ${pad} ${pad + ih - ry} Z`
    : `M ${pad + cr} ${pad} L ${pad + iw - cr} ${pad} Q ${pad + iw} ${pad} ${pad + iw} ${pad + cr}
       L ${pad + iw} ${pad + ih - cr} Q ${pad + iw} ${pad + ih} ${pad + iw - cr} ${pad + ih}
       L ${pad + cr} ${pad + ih} Q ${pad} ${pad + ih} ${pad} ${pad + ih - cr}
       L ${pad} ${pad + cr} Q ${pad} ${pad} ${pad + cr} ${pad} Z`;

  const cid = "clip-" + id;
  const svg = el("svg", {
    width: w, height: h, viewBox: `0 0 ${w} ${h}`, "aria-hidden": "true",
    "data-pad": pad, "data-ih": ih, "data-amp": AMP,
    /* Horizontal-only stretch for a vessel that fills its span. The level maths
       is entirely vertical - setLevel() translates the wave group on Y using
       data-pad/data-ih - so widening the viewport mapping cannot affect what
       percentage the tank appears to hold. */
    ...(stretch ? { preserveAspectRatio: "none" } : {}),
  });
  const defs = el("defs");
  defs.appendChild(el("clipPath", { id: cid }, [el("path", { d: silhouette })]));

  const hatch = el("pattern", { id: "hatch-" + id, width: 7, height: 7, patternUnits: "userSpaceOnUse", patternTransform: "rotate(45)" });
  hatch.appendChild(el("rect", { width: 7, height: 7, fill: "transparent" }));
  hatch.appendChild(el("line", { x1: 0, y1: 0, x2: 0, y2: 7, stroke: "var(--offline)", "stroke-width": 1.6, opacity: .45 }));
  defs.appendChild(hatch);

  // the additive is marked by texture, not hue alone
  let fillRef = `var(--${fluid})`;
  if (fluid === "additive") {
    const ah = el("pattern", { id: "ah-" + id, width: 9, height: 9, patternUnits: "userSpaceOnUse", patternTransform: "rotate(45)" });
    ah.appendChild(el("rect", { width: 9, height: 9, fill: "var(--additive)" }));
    ah.appendChild(el("line", { x1: 0, y1: 0, x2: 0, y2: 9, stroke: "rgba(0,0,0,.38)", "stroke-width": 3.4 }));
    defs.appendChild(ah);
    fillRef = `url(#ah-${id})`;
  }
  svg.appendChild(defs);
  svg.appendChild(el("path", { d: silhouette, fill: "var(--panel)" }));

  const body = el("g", { "clip-path": `url(#${cid})` });
  if (state === "OFFLINE" || state === "SENSOR_ERROR") {
    body.appendChild(el("rect", { x: 0, y: 0, width: w, height: h, fill: `url(#hatch-${id})` }));
  } else {
    const level = el("g", { class: "lvl" });
    const top = pad + ih - (ih * Math.max(0, Math.min(100, pct)) / 100);
    level.setAttribute("transform", `translate(0 ${top - AMP})`);
    level.style.transition = "transform .9s cubic-bezier(.4,0,.2,1)";
    let d = `M 0 ${AMP}`;
    for (let x = 0; x < w * 2 + LEN; x += LEN)
      d += ` q ${LEN / 4} ${-AMP} ${LEN / 2} 0 q ${LEN / 4} ${AMP} ${LEN / 2} 0`;
    d += ` L ${w * 2 + LEN} ${h + AMP} L 0 ${h + AMP} Z`;
    [[.45, 3.4, 0], [1, 2.5, -LEN / 2]].forEach(([op, sec, off], i) => {
      const drift = el("g", { opacity: op });
      drift.appendChild(el("path", { d, fill: fillRef, transform: `translate(${off} 0)` }));
      // a lit crest makes the undulation readable; the closing edges of the
      // same path fall outside the clip, so only the surface line shows
      drift.appendChild(el("path", {
        d, fill: "none", stroke: "rgba(255,255,255,.42)", "stroke-width": 1.7,
        transform: `translate(${off} 0)`,
        ...(stretch ? { "vector-effect": "non-scaling-stroke" } : {}),
      }));
      drift.style.animation = `wave${i} ${sec}s ease-in-out infinite`;
      level.appendChild(drift);
    });
    body.appendChild(level);
  }
  svg.appendChild(body);
  svg.appendChild(el("path", {
    d: silhouette, fill: "none", stroke: "var(--line-2)", "stroke-width": 1.5,
    ...(stretch ? { "vector-effect": "non-scaling-stroke" } : {}),
  }));
  if (shape === "cyl")
    svg.appendChild(el("ellipse", { cx: w / 2, cy: pad + ry, rx: iw / 2, ry, fill: "none", stroke: "var(--line-2)", "stroke-width": 1.5 }));
  return svg;
}
const kf = document.createElement("style");
kf.textContent =
  `@keyframes wave0{0%,100%{transform:translateY(0)}50%{transform:translateY(5.2px)}}` +
  `@keyframes wave1{0%,100%{transform:translateY(4.2px)}50%{transform:translateY(-.6px)}}`;
document.head.appendChild(kf);

/* ── machine ──────────────────────────────────────────────
   Static outer group centres it; the inner group rotates about its own
   origin. A CSS transform replaces the SVG transform attribute outright,
   so the two must never live on the same element.             */
function machine({ r, running, dead }) {
  const s = r * 2;
  const svg = el("svg", { width: s, height: s, viewBox: `0 0 ${s} ${s}`, "aria-hidden": "true" });
  svg.appendChild(el("circle", { cx: r, cy: r, r: r - 1.2, fill: "var(--panel)", stroke: dead ? "var(--offline)" : "var(--line-2)", "stroke-width": 1.4 }));
  const hub = el("g", { transform: `translate(${r} ${r})` });
  const g = el("g", { class: "rotor" });
  const col = dead ? "var(--offline)" : running ? "var(--treated)" : "var(--ink-3)";
  for (let i = 0; i < 3; i++)
    g.appendChild(el("path", {
      d: `M 0 0 Q ${r * .34} ${-r * .30} ${r * .60} ${-r * .12}`,
      fill: "none", stroke: col, "stroke-width": 2, "stroke-linecap": "round",
      transform: `rotate(${i * 120})`
    }));
  g.appendChild(el("circle", { cx: 0, cy: 0, r: 2.4, fill: col }));
  hub.appendChild(g);
  svg.appendChild(hub);
  return svg;
}

/* ── exhaust fan ──────────────────────────────────────────
   Deliberately unlike machine(): an axial fan in a square wall housing,
   four broad filled blades. A pump impeller and a fan must not share a
   glyph — they are different equipment doing different jobs.  */
function fan({ r, running, dead }) {
  const s = r * 2, m = 0.7;
  const col = dead ? "var(--offline)" : running ? "var(--treated)" : "var(--ink-3)";
  const svg = el("svg", { width: s, height: s, viewBox: `0 0 ${s} ${s}`, "aria-hidden": "true" });
  svg.appendChild(el("rect", {
    x: m, y: m, width: s - 2 * m, height: s - 2 * m, rx: 4,
    fill: "var(--panel)", stroke: dead ? "var(--offline)" : "var(--line-2)", "stroke-width": 1.4
  }));
  [[.17, .17], [.83, .17], [.17, .83], [.83, .83]].forEach(([fx, fy]) =>
    svg.appendChild(el("circle", { cx: s * fx, cy: s * fy, r: 1.5, fill: "var(--line-2)" })));
  svg.appendChild(el("circle", { cx: r, cy: r, r: r * .74, fill: "none", stroke: "var(--line-2)", "stroke-width": 1, opacity: .55 }));

  const hub = el("g", { transform: `translate(${r} ${r})` });
  const g = el("g", { class: "rotor" });
  const R = r * .64;
  for (let i = 0; i < 4; i++)
    g.appendChild(el("path", {
      d: `M 0 0 C ${R * .30} ${-R * .44}, ${R * .86} ${-R * .40}, ${R} ${-R * .05}
          C ${R * .72} ${R * .22}, ${R * .26} ${R * .17}, 0 0 Z`,
      fill: col, opacity: .82, transform: `rotate(${i * 90})`
    }));
  g.appendChild(el("circle", { cx: 0, cy: 0, r: r * .15, fill: "var(--panel)", stroke: col, "stroke-width": 1.6 }));
  hub.appendChild(g);
  svg.appendChild(hub);
  return svg;
}

const HPP_PORT = 107 / 128;

/* ── unit builders ────────────────────────────────────────── */
function tankUnit(t, cfg) {
  const u = node("unit");
  u.dataset.u = cfg.id;
  const v = node("vessel");
  v.dataset.a = cfg.id;
  const g = node("glyph");
  g.dataset.g = cfg.id;
  // where the feed pipe lands across this vessel, as a fraction of its width
  if (cfg.portx !== undefined) g.dataset.portx = cfg.portx;
  g.appendChild(vessel({ ...cfg, pct: t.pct, state: t.state }));
  v.appendChild(g);
  const dead = t.state === "OFFLINE" || t.state === "SENSOR_ERROR";
  if (dead) {
    const pn = node("pct");
    pn.appendChild(txt("nodata", "NO DATA"));
    g.appendChild(pn);
  } else {
    g.appendChild(node("pct", `${t.pct.toFixed(0)}<small>% full</small>`));
  }
  /* Above the vessel, so the plant reads top-down: how clean the water is, then
     how much of it there is. Only the two tanks with probes grow one - dosing
     and the sump are passed no wq and get no permanent dash. */
  if (cfg.wq) {
    const td = node("tds " + (cfg.tdsKind || "feed"));
    if (!cfg.wq.fitted) {
      td.className = "tds none";
      td.textContent = "—";
    } else if (cfg.wq.ppm === null) {
      td.className = "tds none";
      td.textContent = "no reading";
    } else {
      td.innerHTML = `${cfg.wq.ppm}<u>ppm</u>`;
    }
    u.appendChild(td);
  }

  u.appendChild(v);
  const cap = node("caption");
  cap.appendChild(txt("name", cfg.label));
  cap.appendChild(txt("sub", dead ? "—" : `${t.distance_mm} mm`));
  let label = t.state, kind = "fault";
  if (t.state === "ONLINE") { label = t.sensor === "OK" ? "Reading" : t.sensor; kind = t.sensor === "OK" ? "on" : "warn"; }
  else if (t.state === "STALE") { kind = "warn"; }
  cap.appendChild(chip(label, kind));
  u.appendChild(cap);
  return u;
}

/* A clamp that is not fitted, or a bias rail that is not there, reports null
   rather than zero: the hub refuses to invent a current, for the same reason an
   uncalibrated tank shows no percentage instead of a plausible wrong one. Render
   that absence as a dash. */
function ampsText(a) {
  return (a === null || a === undefined) ? "\u2014" : `${a.toFixed(1)}<u>A</u>`;
}

function machineUnit(m, label, id, r, draw, ct) {
  const u = node("unit");
  u.dataset.u = id;
  const dead = m.state && m.state !== "ONLINE";
  const w = node("unit" + (m.on && !dead ? " spin" : ""));
  w.dataset.a = id;
  const g = node("glyph");
  g.dataset.g = id;
  g.appendChild((draw || machine)({ r, running: m.on, dead }));
  w.appendChild(g);
  u.appendChild(w);
  u.appendChild(txt("name", label));
  let s = "Idle", kind = "off";
  if (dead) { s = "Offline"; kind = "fault"; }
  else if (m.on) { s = "Running"; kind = "on"; }
  u.appendChild(chip(s, kind));

  /* Only HPP and RWP carry clamps; the ground-floor motors are Phase 2, so they
     are passed no ct and grow no readout rather than showing a permanent dash. */
  if (ct) {
    const a = node("amps");
    a.dataset.amps = id;
    a.innerHTML = ampsText(ct.amps);
    u.appendChild(a);
  }
  return u;
}

/* ── orthogonal pipe routing over measured anchors ──────────
   Pipes are drawn after layout from real element rects, so the elevation
   grid can reflow without the pipework drifting off its vessels.  */
function layoutBox(e, host) {
  let x = 0, y = 0, n = e;
  while (n && n !== host) { x += n.offsetLeft; y += n.offsetTop; n = n.offsetParent; }
  return { x, y, w: e.offsetWidth, h: e.offsetHeight };
}
function anchorPt(id, side, host) {
  const box = document.querySelector(`[data-a="${id}"]`);
  if (!box) return null;
  // some equipment connects away from its mid-height (a vertical pump
  // ports at its base), so allow a per-unit connection line
  if (side === "l" || side === "r") {
    const ym = document.querySelector(`[data-y="${id}"]`);
    if (ym) {
      const bb = layoutBox(box, host), yb = layoutBox(ym, host), S2 = 2;
      return side === "l"
        ? { x: bb.x - S2, y: yb.y }
        : { x: bb.x + bb.w + S2, y: yb.y };
    }
  }
  // horizontal runs use the anchor box (the shared centreline);
  // vertical runs use the glyph itself, or they would float off it
  const vert = side === "t" || side === "b";
  const e = vert ? (document.querySelector(`[data-g="${id}"]`) || box) : box;
  const b = layoutBox(e, host), S = 2;   // pipes meet the equipment
  // A wide vessel does not have to be entered at its midpoint. data-portx is the
  // fraction across the glyph where the pipe lands, so a tank spanning half the
  // roof can be fed near one end instead of dragging the riser to its centre.
  const fx = parseFloat(e.dataset.portx);
  const px = isNaN(fx) ? b.w / 2 : b.w * fx;
  if (side === "t") return { x: b.x + px, y: b.y - S };
  if (side === "b") return { x: b.x + px, y: b.y + b.h + S };
  if (side === "l") return { x: b.x - S, y: b.y + b.h / 2 };
  return { x: b.x + b.w + S, y: b.y + b.h / 2 };
}
function routeD(a, as, b, bs) {
  const va = as === "t" || as === "b", vb = bs === "t" || bs === "b";
  if (va && vb) {
    if (Math.abs(a.x - b.x) < 2) return `M ${a.x} ${a.y} L ${b.x} ${b.y}`;
    // elbow near the destination, so risers stay in their own column
    const my = b.y + (a.y > b.y ? 30 : -30);
    return `M ${a.x} ${a.y} L ${a.x} ${my} L ${b.x} ${my} L ${b.x} ${b.y}`;
  }
  if (!va && !vb) {
    if (Math.abs(a.y - b.y) < 2) return `M ${a.x} ${a.y} L ${b.x} ${b.y}`;
    const mx = (a.x + b.x) / 2;
    return `M ${a.x} ${a.y} L ${mx} ${a.y} L ${mx} ${b.y} L ${b.x} ${b.y}`;
  }
  if (va) return `M ${a.x} ${a.y} L ${a.x} ${b.y} L ${b.x} ${b.y}`;
  return `M ${a.x} ${a.y} L ${b.x} ${a.y} L ${b.x} ${b.y}`;
}
let ROUTES = [], TEE_AXIS = "h";
function drawPipes() {
  const host = $("#plant"), svg = $("#pipes");
  if (!host || !svg) return;
  const W = host.offsetWidth, H = host.offsetHeight, h = host;
  svg.setAttribute("width", W);
  svg.setAttribute("height", H);
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  svg.textContent = "";
  // injection point: midpoint of the RWP -> HPP run, whichever way it runs
  const horiz = TEE_AXIS === "h";
  const rr = anchorPt("filter", horiz ? "r" : "b", h), hl = anchorPt("mf", horiz ? "l" : "t", h);
  const tee = (rr && hl) ? { x: (rr.x + hl.x) / 2, y: (rr.y + hl.y) / 2 } : null;

  ROUTES.forEach(rt => {
    const a = anchorPt(rt.from, rt.fs, h);
    const b = rt.toTee ? tee : anchorPt(rt.to, rt.ts, h);
    if (!a || !b) return;
    const bs = rt.toTee ? (rt.teeSide || "b") : rt.ts;
    const W = rt.thin ? [7, 5, 2.8, "5 7"] : [11, 8.4, 4.6, "9 11"];
    const common = { d: routeD(a, rt.fs, b, bs), fill: "none", "stroke-linejoin": "round", "stroke-linecap": "butt" };
    svg.appendChild(el("path", { ...common, stroke: "var(--line-2)", "stroke-width": W[0] }));
    svg.appendChild(el("path", { ...common, stroke: "#0C1119", "stroke-width": W[1] }));
    if (rt.flow) svg.appendChild(el("path", {
      ...common, stroke: `var(--${rt.fluid})`, "stroke-width": W[2],
      "stroke-dasharray": W[3], class: "flowing" + (rt.thin ? " thin" : "")
    }));
  });

  if (tee) {
    svg.appendChild(el("circle", { cx: tee.x, cy: tee.y, r: 5.4, fill: "var(--line-2)" }));
    svg.appendChild(el("circle", { cx: tee.x, cy: tee.y, r: 3, fill: "var(--additive)" }));
  }
}

/* -- the plant --------------------------------------------
   Wide: a true elevation, tiers at real building height.
   Narrow: the same plant linearised into process order, one unit per
   row, each captioned with where it physically lives.        */
const LOC = {
  bore: "Below ground", sump: "Ground floor \u00b7 parking", smotor: "Ground floor \u00b7 parking",
  rwt: "Roof of RO room", twt: "Roof of RO room",
  rwp: "Terrace \u00b7 RO room", dos: "Terrace \u00b7 RO room", hpp: "Terrace \u00b7 RO room",
  filter: "Terrace \u00b7 RO room", mf: "Terrace \u00b7 RO room", memb: "Terrace \u00b7 RO room",
};

function buildPlant(s) {
  const host = $("#plant");
  [...host.children].forEach(c => { if (c.tagName.toLowerCase() !== "svg") c.remove(); });
  const narrow = window.matchMedia("(max-width:900px)").matches;
  host.classList.toggle("narrow", narrow);

  const T = s.tanks, P = s.pumps, B = s.env.battery_room;
  /* Older firmware, or a page served before the quality block existed, would
     otherwise throw here and drop the whole plant view. */
  const Q = s.quality || { rwt: { fitted: false }, twt: { fitted: false } };
  const live = k => P[k].on && P[k].state === "ONLINE";
  const add = (e, col, row) => { e.style.gridColumn = col; e.style.gridRow = row; host.appendChild(e); return e; };

  const build = {
    rwt:    () => tankUnit(T.rwt,    { w: 118, h: 142, shape: "cyl", fluid: "raw",      label: "Raw Water",     id: "rwt", wq: Q.rwt, tdsKind: "feed" }),
    /* Concrete, not a moulded cylinder: a rectangular poured tank spanning the
       end of the roof slab. Bigger than the others because it is the biggest
       vessel on the roof, and box-shaped because that is what is up there. */
    twt:    () => tankUnit(T.twt,    { w: 300, h: 186, shape: "box", fluid: "treated",  label: "Treated Water", id: "twt", stretch: true, corner: 2, portx: 0.08, wq: Q.twt, tdsKind: "clean" }),
    dos:    () => tankUnit(T.dosing, { w: 82,  h: 96,  shape: "cyl", fluid: "additive", label: "Dosing",        id: "dos" }),
    sump:   () => tankUnit(T.sump,   { w: 176, h: 146, shape: "box", fluid: "raw",      label: "Sump",          id: "sump" }),
    rwp:    () => machineUnit(P.rwp, "RWP", "rwp", 25, null, s.motors && s.motors.rwp),
    hpp:    () => machineUnit(P.hpp, "HPP", "hpp", 25, hppGlyph, s.motors && s.motors.hpp),
    smotor: () => machineUnit(P.sump_motor, "Sump Motor", "smotor", 26, subPumpGlyph),
    bore:   () => machineUnit(P.borewell, "Borewell Pump", "bore", 26),
    filter: () => equipUnit(equipFilter, "Filter", "filter", 58, 126),
    mf:     () => equipUnit(equipMF, "MF", "mf", 26, 50),
    memb:   () => equipUnit(equipMembrane, "RO Membrane", "memb", 116, 42),
  };
  const cell = (k, col, row) => {
    const u = build[k]();
    if (narrow) u.appendChild(txt("loc", LOC[k]));
    const c = node("cell");
    c.appendChild(u);
    return add(c, col, row);
  };

  const roomBox = () => {
    const r = node("room");
    if (s.aster.alarm) r.classList.add("alarm");
    r.appendChild(txt("tag legend", "RO Room"));
    const e = s.env.ro_room, env = node("roomenv");
    env.appendChild(txt("legend", "Room air"));
    if (e.state === "ONLINE") {
      const vt = node("vals", `${e.t.toFixed(1)}<u>\u00b0C</u>`);
      const vh = node("vals", `${e.rh.toFixed(0)}<u>%</u>`);
      vt.dataset.env = "t";
      vh.dataset.env = "rh";
      env.appendChild(vt);
      env.appendChild(vh);
    } else {
      env.appendChild(chip("Sensor offline", "fault"));
    }
    r.appendChild(env);
    return r;
  };
  const annexBox = () => {
    const a = node("annex");
    a.appendChild(txt("tag legend", "Battery Room"));
    const ab = node("unit");
    const fu = node("unit" + (B.fan ? " spin fast" : ""));
    fu.appendChild(fan({ r: 24, running: B.fan, dead: B.state !== "ONLINE" }));
    ab.appendChild(fu);
    ab.appendChild(txt("name", "Exhaust Fan"));

    let bt = "Off", bk = "off";
    if (B.state !== "ONLINE") { bt = "Offline"; bk = "fault"; }
    else if (B.fan) { bt = "Running"; bk = "on"; }
    ab.appendChild(chip(bt, bk));
    a.appendChild(ab);

    const benv = node("roomenv");
    benv.appendChild(txt("legend", "Room air"));
    if (B.state === "ONLINE") {
      const bvt = node("vals", `${B.t.toFixed(1)}<u>\u00b0C</u>`);
      const bvh = node("vals", `${B.rh.toFixed(0)}<u>%</u>`);
      bvt.dataset.env = "bt";
      bvh.dataset.env = "brh";
      benv.appendChild(bvt);
      benv.appendChild(bvh);
    } else {
      benv.appendChild(chip("Sensor offline", "fault"));
    }
    a.appendChild(benv);
    return a;
  };

  if (narrow) {
    // process order, top to bottom: follow the water
    cell("bore", "main", 1);
    cell("sump", "main", 2);
    cell("smotor", "main", 3);
    cell("rwt", "main", 4);
    add(roomBox(), "1 / -1", "5 / span 6");
    cell("rwp", "main", 5);
    cell("filter", "main", 6);
    cell("dos", "branch", 7);
    cell("mf", "main", 8);
    cell("hpp", "main", 9);
    cell("memb", "main", 10);
    cell("twt", "main", 11).classList.add("wide");
    add(annexBox(), "1 / -1", 12);

    TEE_AXIS = "v";
    ROUTES = [
      { from: "bore",   fs: "b", to: "sump",   ts: "t", fluid: "raw",     pump: "borewell" },
      { from: "sump",   fs: "b", to: "smotor", ts: "t", fluid: "raw",     pump: "sump_motor" },
      { from: "smotor", fs: "b", to: "rwt",    ts: "t", fluid: "raw",     pump: "sump_motor" },
      { from: "rwt",    fs: "b", to: "rwp",    ts: "t", fluid: "raw",     pump: "rwp" },
      { from: "rwp",    fs: "b", to: "filter", ts: "t", fluid: "raw",     pump: "rwp" },
      { from: "filter", fs: "b", to: "mf",     ts: "t", fluid: "raw",     pump: "rwp" },
      { from: "mf",     fs: "b", to: "hpp",    ts: "t", fluid: "raw",     pump: "rwp" },

      { from: "dos",    fs: "l", toTee: true, teeSide: "r", fluid: "additive", pump: "rwp", thin: true },
      { from: "hpp",    fs: "b", to: "memb",   ts: "t", fluid: "raw",     pump: "hpp" },
      { from: "memb",   fs: "b", to: "twt",    ts: "t", fluid: "treated", pump: "hpp" },
    ];
  } else {
    [["Solar array", "over both tanks", 1, "top"], ["Roof top", "above RO room", 1, "bot"],
     ["Terrace", "RO room \u00b7 battery room", 2, ""], ["Ground floor", "parking", 3, ""],
     ["Below ground", "borewell", 5, ""]
    ].forEach(([a, b, r, cls]) =>
      add(node("tier " + cls, `<b>${esc(a)}</b><span>${esc(b)}</span>`), "lbl", r));

    add(solarRow("rowA"), "c3 / span 3", 1);
    add(solarRow("rowB"), "c6 / span 2", 1);

    add(roomBox(), "c3 / span 5", 2);

    // slabs: roof of the RO room, terrace floor, then grade
    add(node("slab roof"), "c3 / -1", 1);
    add(node("slab"), "1 / -1", 2);
    const grade = node("slab grade");
    add(grade, "1 / -1", 3);
    const earth = node("earth");
    earth.appendChild(txt("legend", "Ground level"));
    add(earth, "1 / -1", 5);

    cell("rwt", "c3", 1).classList.add("bottom", "onslab");
    /* c7 to the end: the tank runs to the right edge of the slab. Nothing else
       occupies c8 in this row - the battery room annex is row 2. */
    cell("twt", "c7 / -1", 1).classList.add("bottom", "wide", "onslab");
    ["rwp c3", "filter c4", "mf c5", "hpp c6", "memb c7"].forEach(spec => {
      const [k, col] = spec.split(" ");
      const c = cell(k, col, 2);
      c.classList.add("top", "line");
      if (k === "hpp") {
        const ym = node("ymark");
        ym.dataset.y = "hpp";
        ym.style.top = (HPP_PORT * 100).toFixed(2) + "%";
        c.querySelector('[data-g="hpp"]').appendChild(ym);
      }
    });
    cell("dos", "c4 / span 2", 2).classList.add("bottom");
    add(annexBox(), "c8", 2);
    const sumpCell = cell("sump", "c1", 3);
    sumpCell.classList.add("top", "line");

    // the sump motor is submersible: draw it inside the sump, not beside it
    const P2 = P.sump_motor, sDead = P2.state && P2.state !== "ONLINE";
    const holder = node("subpump");
    const pw = node("unit");
    pw.dataset.a = "smotor";
    pw.dataset.g = "smotor";
    const pg = node("glyph");
    pg.appendChild(subPumpGlyph({ r: 44, running: P2.on, dead: sDead }));
    pw.appendChild(pg);
    holder.appendChild(pw);
    sumpCell.querySelector('[data-g="sump"]').appendChild(holder);

    const cap = node("subcap");
    cap.dataset.u = "smotor";
    cap.appendChild(txt("name", "Sump Motor"));
    cap.appendChild(chip("", ""));
    sumpCell.querySelector('[data-u="sump"]').appendChild(cap);

    // the terrace has planters; the ground floor is parking
    const plants = node("scenery plants");
    plants.appendChild(shrubGlyph(202));
    plants.appendChild(shrubGlyph(96));
    add(plants, "c1", 2);

    const cars = node("scenery cars");
    cars.appendChild(truckGlyph(506));
    cars.appendChild(gwagonGlyph(460));
    cars.appendChild(swiftGlyph(396));
    add(cars, "c3 / -1", 3);
    cell("bore", "c1", 5);

    TEE_AXIS = "h";
    ROUTES = [
      { from: "bore",   fs: "t", to: "sump",   ts: "b", fluid: "raw",     pump: "borewell" },
      { from: "smotor", fs: "r", to: "rwt",    ts: "l", fluid: "raw",     pump: "sump_motor" },
      { from: "rwt",    fs: "b", to: "rwp",    ts: "t", fluid: "raw",     pump: "rwp" },
      { from: "rwp",    fs: "r", to: "filter", ts: "l", fluid: "raw",     pump: "rwp" },
      { from: "filter", fs: "r", to: "mf",     ts: "l", fluid: "raw",     pump: "rwp" },
      { from: "mf",     fs: "r", to: "hpp",    ts: "l", fluid: "raw",     pump: "rwp" },
      { from: "dos",    fs: "t", toTee: true, teeSide: "b", fluid: "additive", pump: "rwp", thin: true },
      { from: "hpp",    fs: "r", to: "memb",   ts: "l", fluid: "raw",     pump: "hpp" },
      { from: "memb",   fs: "t", to: "twt",    ts: "b", fluid: "treated", pump: "hpp" },
    ];
  }
}

/* ── live update ──────────────────────────────────────────────
   The plant is built once and mutated afterwards. Rebuilding the DOM
   on every poll restarted every CSS transition and dash animation,
   which is what made the levels and flow jump each second. */
let PLANT_SIG = "", PIPE_SIG = "";

const TANK_SRC = { rwt: "rwt", twt: "twt", dos: "dosing", sump: "sump" };
const PUMP_SRC = { rwp: "rwp", hpp: "hpp", smotor: "sump_motor", bore: "borewell" };

function structSig(s) {
  const tank = o => (o.state === "OFFLINE" || o.state === "SENSOR_ERROR") ? "1" : "0";
  const mach = o => (o.state && o.state !== "ONLINE") ? "1" : "0";
  return (window.matchMedia("(max-width:900px)").matches ? "n" : "w")
    + Object.values(TANK_SRC).map(k => tank(s.tanks[k])).join("")
    + Object.values(PUMP_SRC).map(k => mach(s.pumps[k])).join("")
    + (s.env.battery_room.state !== "ONLINE" ? "1" : "0");
}

function setLevel(id, pct) {
  const svg = document.querySelector(`[data-g="${id}"] svg`);
  const lvl = svg && svg.querySelector(".lvl");
  if (!lvl) return;
  const pad = +svg.getAttribute("data-pad"), ih = +svg.getAttribute("data-ih"), amp = +svg.getAttribute("data-amp");
  const top = pad + ih - (ih * Math.max(0, Math.min(100, pct)) / 100);
  lvl.setAttribute("transform", `translate(0 ${top - amp})`);
}

function paintRotor(svg, on, dead) {
  if (!svg) return;
  const col = dead ? "var(--offline)" : on ? "var(--treated)" : "var(--ink-3)";
  svg.querySelectorAll(".rotor path").forEach(e => e.setAttribute("stroke", col));
  svg.querySelectorAll(".rotor circle").forEach(e => e.setAttribute("fill", col));
  const casing = svg.querySelector("circle, rect");
  if (casing) casing.setAttribute("stroke", dead ? "var(--offline)" : "var(--line-2)");
}

function setSpin(el2, on, extra) {
  if (!el2) return;
  const cls = "unit" + (on ? " spin" : "") + (extra || "");
  if (el2.className !== cls) el2.className = cls;
}

function updatePlant(s) {
  Object.entries(TANK_SRC).forEach(([id, key]) => {
    const t = s.tanks[key], u = document.querySelector(`[data-u="${id}"]`);
    if (!u) return;
    const dead = t.state === "OFFLINE" || t.state === "SENSOR_ERROR";
    if (!dead) setLevel(id, t.pct);
    const pctEl = u.querySelector(".pct");
    if (pctEl && !dead) pctEl.innerHTML = `${t.pct.toFixed(0)}<small>% full</small>`;
    const sub = u.querySelector(".sub");
    if (sub) sub.textContent = dead ? "\u2014" : `${t.distance_mm} mm`;
    const c = u.querySelector(".chip");
    if (c) {
      let label = t.state, kind = "fault";
      if (t.state === "ONLINE") { label = t.sensor === "OK" ? "Reading" : t.sensor; kind = t.sensor === "OK" ? "on" : "warn"; }
      else if (t.state === "STALE") { kind = "warn"; }
      c.textContent = label;
      c.className = "chip " + kind;
    }
  });

  Object.entries(PUMP_SRC).forEach(([id, key]) => {
    const m = s.pumps[key], u = document.querySelector(`[data-u="${id}"]`);
    if (!u) return;
    const dead = m.state && m.state !== "ONLINE";
    const w = document.querySelector(`[data-a="${id}"]`);
    setSpin(w, m.on && !dead);
    paintRotor(w && w.querySelector("svg"), m.on, dead);
    const c = u.querySelector(".chip");
    if (c) {
      let label = "Idle", kind = "off";
      if (dead) { label = "Offline"; kind = "fault"; }
      else if (m.on) { label = "Running"; kind = "on"; }
      c.textContent = label;
      c.className = "chip " + kind;
    }

    const aEl = u.querySelector(".amps");
    if (aEl) {
      const ct = s.motors && s.motors[id];
      aEl.innerHTML = ampsText(ct ? ct.amps : null);
      /* Over-current is published per plant, not per channel, so both readouts
         redden together. The notification text names both figures. */
      aEl.className = "amps" + (s.motors && s.motors.overcurrent ? " over" : "");
    }
  });

  /* Toggled here rather than in the structural rebuild: the alarm flips on a
     poll and structSig deliberately does not rebuild for it. */
  const room = document.querySelector(".room");
  if (room) room.classList.toggle("alarm", !!s.aster.alarm);

  const e = s.env.ro_room;
  const vt = document.querySelector('[data-env="t"]'), vh = document.querySelector('[data-env="rh"]');
  if (vt && e.state === "ONLINE") vt.innerHTML = `${e.t.toFixed(1)}<u>\u00b0C</u>`;
  if (vh && e.state === "ONLINE") vh.innerHTML = `${e.rh.toFixed(0)}<u>%</u>`;

  const B = s.env.battery_room;
  const bvt = document.querySelector('[data-env="bt"]'), bvh = document.querySelector('[data-env="brh"]');
  if (bvt && B.state === "ONLINE") bvt.innerHTML = `${B.t.toFixed(1)}<u>\u00b0C</u>`;
  if (bvh && B.state === "ONLINE") bvh.innerHTML = `${B.rh.toFixed(0)}<u>%</u>`;
  const annex = document.querySelector(".annex");
  if (annex) {
    const fw = annex.querySelector(".unit .unit");
    setSpin(fw, B.fan, B.fan ? " fast" : "");
    paintRotor(fw && fw.querySelector("svg"), B.fan, B.state !== "ONLINE");
    const c = annex.querySelector(".chip");
    if (c) {
      let label = "Off", kind = "off";
      if (B.state !== "ONLINE") { label = "Offline"; kind = "fault"; }
      else if (B.fan) { label = "Running"; kind = "on"; }
      c.textContent = label;
      c.className = "chip " + kind;
    }
  }
}

function syncPipes(force) {
  const sig = ROUTES.map(r => r.flow ? "1" : "0").join("");
  if (!force && sig === PIPE_SIG) return;
  PIPE_SIG = sig;
  drawPipes();
}

function drawPlant(s) {
  const sig = structSig(s);
  const rebuilt = sig !== PLANT_SIG;
  if (rebuilt) { PLANT_SIG = sig; buildPlant(s); }
  const live = k => s.pumps[k].on && s.pumps[k].state === "ONLINE";
  ROUTES.forEach(r => { r.flow = live(r.pump); });
  updatePlant(s);
  if (rebuilt) requestAnimationFrame(() => { relayout(); syncPipes(true); });
  else syncPipes(false);
}

/* ── panels ───────────────────────────────────────────────── */
function climate(host, c) {
  host.textContent = "";
  if (c.state !== "ONLINE") {
    const m = node("metric", `<span class="legend">Sensor</span>`);
    m.appendChild(chip(c.state, "fault"));
    host.appendChild(m);
    return;
  }
  host.appendChild(node("metric", `<span class="legend">Temperature</span><span class="big">${c.t.toFixed(1)}<u>°C</u></span>`));
  host.appendChild(node("metric", `<span class="legend">Humidity</span><span class="big">${c.rh.toFixed(0)}<u>%</u></span>`));
  const foot = node("srcline", `<span class="legend">${esc(c.src)}</span>`);
  foot.appendChild(chip(c.age_s <= 10 ? "Fresh" : "Stale " + ago(c.age_s), c.age_s <= 10 ? "on" : "warn"));
  host.appendChild(foot);
}
function rows(host, list) {
  host.textContent = "";
  list.forEach(([k, label, kind, note]) => {
    const r = node("row");
    r.appendChild(txt("k", k));
    const v = node("v");
    if (note) v.appendChild(txt("n", note));
    v.appendChild(chip(label, kind));
    r.appendChild(v);
    host.appendChild(r);
  });
}

/* Dismissed alerts stay dismissed only while the condition holds; once it
   clears, the key is dropped so a recurrence shows again. */
const DISMISSED = new Set();

function drawAlerts(s) {
  const out = [], T = s.tanks;
  const add = (kind, title, body, where) => out.push({ kind, title, body, where });

  if (T.sump.state === "ONLINE" && T.sump.pct < 15)
    add("fault", "Dry run risk", "Sump below 15 percent. Sump motor should be held off until it recovers.", "Sump");
  [["sump", "Sump"], ["rwt", "Raw Water"], ["twt", "Treated Water"]].forEach(([k, n]) => {
    if (T[k].state === "ONLINE" && T[k].pct > 95) add("warn", "Overflow risk", `${n} above 95 percent.`, n);
  });
  if (T.dosing.state === "ONLINE" && T.dosing.pct < 20)
    add("warn", "Chemical low", "Dosing tank below 20 percent. Replenish anti-scalant.", "Dosing");
  if (s.aster.alarm)
    add("fault", "Controller alarm", "Aster NXT 11 alarm contact is active. Check LPS and HPS pressure switches.", "RO Room");
  if (s.env.battery_room.state === "ONLINE" && s.env.battery_room.t > 38)
    add("warn", "Battery room hot", `Room at ${s.env.battery_room.t.toFixed(1)} °C. Exhaust fan ${s.env.battery_room.fan ? "running" : "is off"}.`, "Battery Room");
  s.nodes.filter(n => n.state === "OFFLINE").forEach(n =>
    add("warn", "Node offline", `The ${n.role} node has not answered for ${ago(n.age_s)}.`, n.id));

  out.forEach(a => { a.key = a.kind + "|" + a.title + "|" + a.where; });
  const live = new Set(out.map(a => a.key));
  [...DISMISSED].forEach(k => { if (!live.has(k)) DISMISSED.delete(k); });

  const host = $("#alerts");
  host.textContent = "";
  out.filter(a => !DISMISSED.has(a.key)).forEach(a => {
    const row = node("alert " + a.kind,
      `<b>${esc(a.title)}</b><span>${esc(a.body)}</span><span class="where">${esc(a.where)}</span>`);
    const x = document.createElement("button");
    x.type = "button";
    x.className = "x";
    x.textContent = "\u00d7";
    x.setAttribute("aria-label", "Dismiss alert: " + a.title);
    x.addEventListener("click", () => { DISMISSED.add(a.key); drawAlerts(s); });
    row.appendChild(x);
    host.appendChild(row);
  });
}

function render(s) {
  LAST = s;
  drawAlerts(s);
  drawPlant(s);
  climate($("#cRoom"), s.env.ro_room);
  climate($("#cBatt"), s.env.battery_room);

  const B = s.env.battery_room, fh = $("#cBattFan");
  if (!fh.firstChild) {
    const fw0 = node("unit");
    fw0.appendChild(fan({ r: 21, running: false, dead: false }));
    fh.appendChild(fw0);
    const ftxt = node("txtblk", `<span class="legend">Exhaust fan</span>`);
    ftxt.appendChild(chip("", ""));
    fh.appendChild(ftxt);
  }
  const fw = fh.firstChild;
  setSpin(fw, B.fan, B.fan ? " fast" : "");
  paintRotor(fw.querySelector("svg"), B.fan, B.state !== "ONLINE");
  const fc = fh.querySelector(".txtblk .chip");
  let ft = "Off", fk = "off";
  if (B.state !== "ONLINE") { ft = "Unknown"; fk = "fault"; }
  else if (B.fan) { ft = "Running"; fk = "on"; }
  fc.textContent = ft;
  fc.className = "chip " + fk;

  /* Rejection is the row that matters: permeate TDS rising on its own is a fact
     about the borewell, not the plant. Feed and permeate are shown beside it so
     a falling percentage can be attributed to one or the other. */
  const Q = s.quality;
  /* "Not fitted" and "no reading" are different facts and must not print the
     same: the first is a probe nobody has installed, the second is one that has
     stopped answering. Same distinction the tank levels draw. */
  const ppm = w => !w.fitted ? "Not fitted" : w.ppm === null ? "No reading" : `${w.ppm} ppm`;
  const kind = w => !w.fitted ? "off" : w.ppm === null ? "warn" : "on";
  const wt  = w => (w.fitted && w.t !== null) ? `${w.t.toFixed(1)} °C` : null;
  let rejLabel = "–", rejKind = "off";
  if (Q.rejection !== null) {
    rejLabel = `${Q.rejection}%`;
    /* An RO membrane in good order rejects well over 90%. Below 85 is worth
       looking at; below 75 the permeate is drifting towards the feed. */
    rejKind = Q.rejection >= 90 ? "on" : Q.rejection >= 75 ? "warn" : "fault";
  }
  rows($("#cQuality"), [
    ["Salt rejection", rejLabel, rejKind],
    ["Raw water", ppm(Q.rwt), kind(Q.rwt), wt(Q.rwt)],
    ["Treated water", ppm(Q.twt), kind(Q.twt), wt(Q.twt)],
  ]);

  const A = s.aster;
  rows($("#cAster"), [
    ["TWT FLOTY", A.twt_floty ? "Closed" : "Open", A.twt_floty ? "on" : "off"],
    ["RWT FLOTY", A.rwt_floty ? "Closed" : "Open", A.rwt_floty ? "on" : "off"],
    ["SUMP FLOTY", A.sump_floty ? "Closed" : "Open", A.sump_floty ? "on" : "off"],
    ["DOS LVL", A.dos_lvl ? "Closed" : "Open", A.dos_lvl ? "on" : "off"],
    ["RL1", A.rl1 ? "Active" : "Inactive", A.rl1 ? "on" : "off"],
    ["RL2", A.rl2 ? "Active" : "Inactive", A.rl2 ? "on" : "off"],
    ["LPS", A.lps ? "Low pressure" : "Normal", A.lps ? "warn" : "off"],
    ["ALARM", A.alarm ? (A.lps ? "Low pressure" : "Active") : "Clear", A.alarm ? "fault" : "off"],
  ]);
  rows($("#cNodes"), s.nodes.map(n => {
    let label = "Offline", kind = "fault";
    if (n.state === "ONLINE") { label = "Online"; kind = "on"; }
    else if (n.state === "STALE") { label = "Stale"; kind = "warn"; }
    return [`${n.id}  ${n.role}`, label, kind, `${n.link} · ${ago(n.age_s)}`];
  }));

  $("#hBus").textContent = `${s.rs485.online}/${s.rs485.total}`;
  $("#hRssi").textContent = `${s.sys.rssi} dBm`;
  $("#hUp").textContent = dur(s.sys.uptime_s);
  $("#hClock").textContent = new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" });
  $("#fFw").textContent = s.sys.fw;
  $("#fReset").textContent = s.sys.reset_reason;
  $("#fErr").textContent = s.rs485.errors;
  $("#fPoll").textContent = s.rs485.last_poll_ms + " ms";
}
let LAST = null;

/* The plant should be readable at a glance without scrolling; the cards
   below are reference material and may sit past the fold. */
function fitPlant() {
  const wrap = document.querySelector(".plantwrap"), pl = $("#plant");
  if (!wrap || !pl) return;
  pl.style.transform = "none";
  pl.style.width = "";
  wrap.style.height = "auto";
  const cs = getComputedStyle(wrap);
  const padT = parseFloat(cs.paddingTop) || 0, padB = parseFloat(cs.paddingBottom) || 0;
  const padL = parseFloat(cs.paddingLeft) || 0, padR = parseFloat(cs.paddingRight) || 0;
  const availW = Math.max(1, wrap.clientWidth - padL - padR);
  if (!pl.offsetWidth || !pl.offsetHeight) return;

  let sc;
  if (window.matchMedia("(max-width:900px)").matches) {
    sc = Math.min(1, availW / pl.offsetWidth);
  } else {
    // document coordinates, so scrolling cannot change the scale
    const top = pl.getBoundingClientRect().top + window.scrollY;
    const availH = Math.max(160, window.innerHeight - top - padB - 10);
    // The fit is height-bound, so a plant laid out at the wrapper width
    // shrinks away from both edges. Lay it out wider by the same factor
    // and the height fit lands it at exactly the full width. Two passes,
    // because widening can reflow a caption and change the height.
    for (let i = 0; i < 2; i++) {
      sc = Math.max(.45, Math.min(1, availH / pl.offsetHeight));
      pl.style.width = Math.round(availW / sc) + "px";
    }
    sc = Math.max(.45, Math.min(1, availH / pl.offsetHeight));
  }
  // origin is top left, so centre by hand when min-width stops it filling
  const dx = Math.max(0, (availW - pl.offsetWidth * sc) / 2);
  pl.style.transform = `translateX(${dx.toFixed(1)}px) scale(${sc})`;
  wrap.style.height = Math.ceil(pl.offsetHeight * sc + padT + padB) + "px";
}
/* Stand rowB's right-hand PV post on the TWT roof instead of running it down to
   the slab. It already LOOKED seated, because a tank that tall simply hides the
   post behind it - but that is coincidence, not construction, and it would come
   apart the moment the tank got shorter. This makes the foot real.

   Measured, not hardcoded: the tank's top edge is its own height plus the caption
   block underneath it in the same unit, and both move when the layout reflows.
   layoutBox() walks offsetParents and so reports the plant's own UNSCALED
   coordinates - the same space post.style.top is written in. Reading
   getBoundingClientRect() here would mix scaled pixels with unscaled ones and the
   foot would drift as fitPlant() scales the drawing. */
function seatSolarLeg() {
  const host = $("#plant");
  const row = document.querySelector(".solar.rowB");
  const post = row && row.querySelector('[data-foot="right"]');
  const tank = document.querySelector('[data-g="twt"]');
  if (!host || !row || !post || !tank) return;      // narrow layout has no PV rows

  const r = layoutBox(row, host), t = layoutBox(tank, host);
  const bottom = (r.y + r.h) - t.y;
  // Negative would mean the tank top is below the slab line; leave the post on
  // the slab rather than drawing it upside down.
  post.style.bottom = (bottom > 0 ? bottom : 0).toFixed(1) + "px";
}

function relayout() {
  const hdr = document.querySelector("header");
  if (hdr) document.documentElement.style.setProperty("--hdr", hdr.offsetHeight + "px");
  fitPlant();
  seatSolarLeg();
  drawPipes();
  PIPE_SIG = ROUTES.map(r => r.flow ? "1" : "0").join("");
}
new ResizeObserver(relayout).observe(document.documentElement);
window.matchMedia("(max-width:900px)").addEventListener("change", () => { if (LAST) render(LAST); });

/* ── demo simulator ───────────────────────────────────────────
   Runs until /api/telemetry answers. Models the failure this project
   exists to fix: the borewell goes dry, the sump drains, and the sump
   motor keeps lifting because RWT is still below its float.    */
/* Demo overrides, for eyeballing states that are rare on a real plant:
     ?alarm=1   holds the controller fault on, so the RO room keeps flashing
     ?oc=1      holds over-current on, so both amp readouts stay red
   Deliberately NOT the defaults. This simulator is also what the page falls back
   to whenever the hub is unreachable, and a permanently red flashing room there
   would read as a genuine plant fault to whoever opened it next. */
const DEMO_FORCE = new URLSearchParams(location.search);

const demo = {
  sys: { uptime_s: 267340, rssi: -58, fw: "0.4.0-dev", reset_reason: "Power on" },
  rs485: { online: 4, total: 4, errors: 3, last_poll_ms: 412 },
  tanks: {
    sump:   { pct: 46, distance_mm: 1890, state: "ONLINE", sensor: "OK" },
    rwt:    { pct: 38, distance_mm: 1240, state: "ONLINE", sensor: "OK" },
    dosing: { pct: 17, distance_mm: 452,  state: "ONLINE", sensor: "OK" },
    twt:    { pct: 71, distance_mm: 640,  state: "ONLINE", sensor: "OK" },
  },
  pumps: {
    borewell:   { on: true, state: "ONLINE" },
    sump_motor: { on: true, state: "ONLINE" },
    rwp:        { on: true, state: "ONLINE" },
    hpp:        { on: true, state: "ONLINE" },
  },
  quality: {
    rwt: { ppm: 612, t: 28.4, fitted: true },
    twt: { ppm: 31, t: 28.1, fitted: true },
    rejection: 95,
  },
  aster: { twt_floty: false, rwt_floty: true, sump_floty: false, dos_lvl: true, rl1: true, rl2: true, alarm: false, lps: false },
  motors: { hpp: { amps: 8.4 }, rwp: { amps: 5.1 }, overcurrent: false },
  env: {
    ro_room:      { t: 31.4, rh: 62, state: "ONLINE", src: "SHT30 · I2C 0x44", age_s: 2 },
    battery_room: { t: 36.2, rh: 48, fan: false, state: "ONLINE", src: "SHT30 · Node 0x04", age_s: 1 },
  },
  nodes: [
    { id: "0x01", role: "Dosing", link: "RS485", state: "ONLINE", age_s: 1 },
    { id: "0x02", role: "Raw Water", link: "RS485", state: "ONLINE", age_s: 1 },
    { id: "0x03", role: "Treated Water", link: "RS485", state: "ONLINE", age_s: 2 },
    { id: "0x04", role: "Battery Room", link: "RS485", state: "ONLINE", age_s: 1 },
    { id: "0x05", role: "Sump", link: "Wi-Fi", state: "ONLINE", age_s: 3 },
    { id: "0x06", role: "Motors", link: "Wi-Fi", state: "OFFLINE", age_s: 94 },
  ],
};
let tick = 0;
function stepDemo() {
  const d = demo, T = d.tanks;
  tick++;
  d.sys.uptime_s += 2;
  d.nodes.forEach(n => { if (n.state === "OFFLINE") n.age_s += 2; });

  if (d.pumps.borewell.on) T.sump.pct += 0.55;
  if (d.pumps.sump_motor.on) { T.sump.pct -= 1.5; T.rwt.pct += 0.8; }
  if (d.pumps.rwp.on) { T.rwt.pct -= 0.35; T.dosing.pct -= 0.06; }
  if (d.pumps.hpp.on) T.twt.pct += 0.30;
  T.twt.pct -= 0.22;

  if (tick === 22) d.pumps.borewell.on = false;        // the borewell runs dry
  if (tick === 70) { d.pumps.borewell.on = true; T.dosing.pct = 84; tick = 0; }

  /* The demo trips the controller alarm and an over-current for a few ticks so
     both of those states can be seen without a plant attached - which is the
     only way to check them before the panel is live. */
  d.aster.alarm = DEMO_FORCE.has("alarm") || (tick >= 40 && tick < 48);
  /* ?lps=1 puts the fault down to low feed pressure - the one cause the hub can
     actually name, since ALARM alone never says which fault tripped. */
  d.aster.lps = DEMO_FORCE.has("lps") || (tick >= 42 && tick < 48);
  d.motors.overcurrent = DEMO_FORCE.has("oc") || (tick >= 56 && tick < 62);
  d.motors.hpp.amps = d.pumps.hpp.on ? 8.2 + Math.sin(tick / 6) * 0.6 + (d.motors.overcurrent ? 4.6 : 0) : 0;
  d.motors.rwp.amps = d.pumps.rwp.on ? 5.0 + Math.sin(tick / 7) * 0.4 : 0;

  d.pumps.sump_motor.on = T.rwt.pct < 72;              // driven by the RWT float, as wired today
  d.pumps.rwp.on = T.rwt.pct > 8 && T.twt.pct < 94;
  d.pumps.hpp.on = d.pumps.rwp.on;
  d.env.battery_room.t = 36.6 + Math.sin(tick / 9) * 2.4;
  d.env.battery_room.fan = d.env.battery_room.t > 38;
  d.env.ro_room.t = 31.4 + Math.sin(tick / 14) * 0.8;
  d.aster.rwt_floty = T.rwt.pct < 72;
  d.aster.twt_floty = T.twt.pct > 94;
  d.aster.dos_lvl = T.dosing.pct > 12;

  for (const k in T) {
    T[k].pct = Math.max(0, Math.min(100, T[k].pct));
    T[k].distance_mm = Math.round(2400 - T[k].pct * 18);
  }
  render(d);
}

/* ── live ─────────────────────────────────────────────────── */
let demoTimer = null;
async function poll() {
  try {
    const r = await fetch("/api/telemetry", { cache: "no-store" });
    if (!r.ok) throw new Error("telemetry " + r.status);
    const s = await r.json();
    if (demoTimer) { clearInterval(demoTimer); demoTimer = null; }
    const m = $("#mode");
    m.textContent = "Live";
    m.classList.add("live");
    render(s);
  } catch {
    if (!demoTimer) { demoTimer = setInterval(stepDemo, 2000); stepDemo(); }
  }
}
poll();
setInterval(poll, 1000);
</script>
</body>
